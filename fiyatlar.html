<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiyatlarımız</title>

<style>
:root{
  --lila:#a78bff;
  --lila-dark:#7f63e6;
  --bg:#0e0e0e;
  --card:#1a1a1a;
  --white:#ffffff;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:#fff;
}

.container{
  max-width:360px;
  margin:auto;
  padding:24px 16px;
  text-align:center;
}

/* Geri Butonu */
#geriBtn{
  width:100%;
  padding:10px 14px;
  margin-bottom:20px;
  font-size:12px;
  font-weight:600;
  border:none;
  border-radius:22px;
  background:#fff;
  color:#111;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
#geriBtn:active{
  transform:scale(.95);
}

/* Slogan */
.slogan{
  font-size:16px;
  color:var(--lila);
  margin-bottom:22px;
  font-weight:600;
}

/* ANA ACCORDION */
.accordion{
  width:100%;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:22px;
  border:none;
  cursor:pointer;
  text-align:center;
  font-size:14px;
  font-weight:600;
  color:#fff;

  background:linear-gradient(145deg,var(--lila),var(--lila-dark));
  box-shadow:
    0 8px 18px rgba(0,0,0,.55),
    0 0 0 rgba(167,139,255,0);

  transition:transform .18s ease, box-shadow .18s ease;
}
.accordion:hover{
  box-shadow:
    0 10px 22px rgba(0,0,0,.6),
    0 0 22px rgba(167,139,255,.6);
}
.accordion:active{
  transform:scale(.96);
}

/* PANEL */
.panel{
  display:none;
  background:#202020;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  text-align:left;
}

/* LİSTE */
.panel ul{
  list-style:none;
  padding:0;
  margin:0;
}
.panel li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
}

/* BADGE */
.badge{
  padding:4px 10px;
  border-radius:14px;
  font-size:12px;
  font-weight:600;
  color:#111;
  background:linear-gradient(145deg,var(--lila),var(--lila-dark));
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}

/* ALT ACCORDION */
.innerAccordion{
  background:var(--card);
  margin:10px 0 6px 0;
  padding:12px;
  border-radius:18px;
  cursor:pointer;
  text-align:center;
  font-size:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
  transition:transform .15s ease, box-shadow .15s ease;
}
.innerAccordion:hover{
  box-shadow:
    0 6px 14px rgba(0,0,0,.6),
    0 0 16px rgba(167,139,255,.35);
}
.innerAccordion:active{
  transform:scale(.97);
}

.innerPanel{
  display:none;
  background:#202020;
  border-radius:16px;
  padding:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<button id="geriBtn" onclick="window.location.href='index.html'">⬅ Ana Sayfa</button>

<div class="slogan">6 Kahve Sizden, 1 Kahve Bizden</div>

<button class="accordion">Karaoke Fiyatları</button>
<div class="panel">
  <ul>
    <li>1 Saat Kişi Başı <span class="badge">200 TL</span></li>
  </ul>
</div>

<button class="accordion">Prova Stüdyoları</button>
<div class="panel">
  <ul>
    <li>1 Saat <span class="badge">600 TL</span></li>
  </ul>
</div>

<button class="accordion">Kayıt / Mix / Mastering</button>
<div class="panel">
  <p>Lütfen iletişime geçiniz<br><strong>541 719 57 06</strong></p>
</div>

<button class="accordion">Kafe Menü</button>
<div class="panel">

  <div class="innerAccordion">☕ Kahveler</div>
  <div class="innerPanel">
    <ul>
      <li>Türk Kahvesi <span class="badge">70 TL</span></li>
      <li>Filtre Kahve <span class="badge">100 TL</span></li>
      <li>Espresso <span class="badge">70 TL</span></li>
      <li>Latte <span class="badge">110 TL</span></li>
    </ul>
  </div>

  <div class="innerAccordion">🍵 Çaylar</div>
  <div class="innerPanel">
    <ul>
      <li>Siyah Çay <span class="badge">35 TL</span></li>
      <li>Bitki Çayları <span class="badge">55 TL</span></li>
    </ul>
  </div>

</div>

</div>

<script>
document.querySelectorAll(".accordion").forEach(btn=>{
  btn.onclick=()=>{
    const p=btn.nextElementSibling;
    p.style.display=p.style.display==="block"?"none":"block";
  }
});

document.querySelectorAll(".innerAccordion").forEach(btn=>{
  btn.onclick=e=>{
    const p=btn.nextElementSibling;
    p.style.display=p.style.display==="block"?"none":"block";
    e.stopPropagation();
  }
});
</script>

</body>
</html>
