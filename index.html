<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>
<style>
body{
  margin:0;
  font-family:'Arial', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)), url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}

/* Hoş Geldiniz Mesajı Üstte */
#welcome{
  position:fixed;
  top:10px; /* en üstte */
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  font-weight:700;
  color:#ffffff;
  font-family:'Courier New', Courier, monospace;
  opacity:1;
  animation: fadeOut 3s ease forwards 3s;
  z-index:999;
  text-align:center;
}

@keyframes fadeOut{
  0% { opacity:1; }
  100% { opacity:0; transform:translateY(-30px); }
}

/* Container */
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
  margin-top:60px; /* hoşgeldiniz yazısı üstteyse biraz boşluk */
}

/* Logo */
.logo{
  text-align:center;
  margin:20px 0 25px;
}
.logo img{
  max-width:220px;
  height:auto;
  display:block;
  margin:auto;
}

/* Butonlar */
.btn{
  display:block;
  width:250px; /* Sabit genişlik, tüm butonlar aynı */
  padding:12px;
  margin:8px auto; /* ortada alt alta */
  font-size:16px;
  border-radius:14px;
  border:none;
  background:#fff;
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:0.15s ease-in-out;
  text-align:center;
  box-shadow:0 3px 6px rgba(0,0,0,0.2);
}
.btn:hover{
  background:#f0f0f0;
}
.btn:active{
  background:#e0e0e0;
  transform:scale(0.97); /* hafif gömülme */
}

/* Responsive */
@media screen and (max-width:400px){
  #welcome{
    font-size:28px;
  }
  .btn{
    width:200px;
    font-size:14px;
    padding:10px;
  }
}
</style>
</head>
<body>

<!-- Hoş Geldiniz Mesajı -->
<div id="welcome">Hoş Geldiniz!</div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img src="fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- Butonlar ALT ALTA, SABİT EN -->
  <a href="karaoke.html"><button class="btn">🎤 Karaoke Hatırlatıcı</button></a>
  <a href="fotograflar.html"><button class="btn">📸 Fotoğraflarımız</button></a>
  <a href="fiyatlar.html"><button class="btn">💰 Fiyatlarımız</button></a>
  <button class="btn">📅 Rezervasyon</button>
  <button class="btn">📝 Dilek / İstek / Öneri</button>
  <button class="btn">📲 Bizi Takip Edin</button>

</div>

<script>
// 3 saniye sonra hoş geldiniz mesajını kaldır
setTimeout(() => {
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
}, 6000);
</script>

</body>
</html>
