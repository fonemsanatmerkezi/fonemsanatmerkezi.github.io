<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fonem Sanat Merkezi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat', sans-serif;
}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("assets/bg.jpeg") center/cover no-repeat fixed;
  color:#fff;
}

/* HOŞGELDİNİZ */
#welcome{
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:34px;
  letter-spacing:2px;
  z-index:1000;
  animation:welcomeFade 3s forwards;
}

@keyframes welcomeFade{
  0%{opacity:0}
  20%{opacity:1}
  70%{opacity:1}
  100%{opacity:0; visibility:hidden}
}

/* ANA KAPSAYICI */
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* PLAK */
.record{
  width:220px;
  height:220px;
  margin:30px auto 35px;
  border-radius:50%;
  background:
    radial-gradient(circle at center,
      #111 0%,
      #000 60%);
  border:4px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:spin 7s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* LOGO */
.record img{
  width:75%;
  height:75%;
  object-fit:contain;
}

/* BUTONLAR */
.menu-btn{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid #fff;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.25s;
}

.menu-btn:hover{
  background:rgba(255,255,255,.25);
  transform:scale(1.03);
}
</style>
</head>

<body>

<div id="welcome">HOŞ GELDİNİZ</div>

<div class="container">

  <!-- PLAK -->
  <div class="record">
    <img src="assets/logo.png" alt="Fonem Logo">
  </div>

  <!-- BUTONLAR -->
  <a href="karaoke.html"><button class="menu-btn">Şarkı Hatırlatıcı</button></a>
  <a href="fotograflar.html"><button class="menu-btn">Fotoğraflarımız</button></a>
  <a href="fiyatlar.html"><button class="menu-btn">Fiyatlarımız</button></a>
  <a href="rezervasyon.html"><button class="menu-btn">Rezervasyon</button></a>
  <a href="dilek.html"><button class="menu-btn">Dilek / İstek / Öneri</button></a>
  <a href="takip.html"><button class="menu-btn">Bizi Takip Edin</button></a>

</div>

</body>
</html>
