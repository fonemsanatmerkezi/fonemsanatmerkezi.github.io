<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:'Poppins',sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("assets/github-arka-plan.jpeg") center/cover fixed;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}

/* HOŞ GELDİNİZ */
#welcome{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:22px;
  letter-spacing:1px;
  opacity:0;
  animation:welcomeFade 3s ease forwards;
  pointer-events:none;
}
@keyframes welcomeFade{
  0%{opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{opacity:0}
}

/* SAHNE */
.stage{
  position:relative;
  width:360px;
  height:360px;
}

/* PLAK */
.record{
  position:absolute;
  top:50%;
  left:50%;
  width:200px;
  height:200px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#111 38%,#000 39%);
  border:4px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 40px rgba(255,255,255,.25);
  animation:spin 14s linear infinite;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

.record img{
  width:92%;
  border-radius:50%;
}

/* BUTON ORTAK */
.menu{
  position:absolute;
  width:100%;
  height:100%;
}

.menu a{
  position:absolute;
  background:#fff;
  color:#000;
  text-decoration:none;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  font-weight:600;
  box-shadow:
    0 8px 18px rgba(0,0,0,.35),
    0 0 0 rgba(255,255,255,0);
  transition:
    box-shadow .25s ease,
    filter .25s ease,
    transform .12s ease;
}

/* HAFİF BÜYÜME */
.menu a:hover{
  filter:brightness(1.12);
  box-shadow:
    0 10px 22px rgba(0,0,0,.4),
    0 0 18px rgba(255,255,255,.7);
}

.menu a:active{
  transform:scale(.96);
}

/* KONUMSALLAR */
.m1{ top:0; left:50%; transform:translateX(-50%); }
.m2{ top:80px; right:0; }
.m3{ bottom:80px; right:0; }
.m4{ bottom:0; left:50%; transform:translateX(-50%); }
.m5{ bottom:80px; left:0; }
.m6{ top:80px; left:0; }
</style>
</head>

<body>

<div id="welcome">Hoş Geldiniz</div>

<div class="stage">

  <!-- PLAK -->
  <div class="record">
    <img src="assets/fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- MENÜ -->
  <div class="menu">
    <a class="m1" href="karaoke.html">Şarkı Hatırlatıcı</a>
    <a class="m2" href="fotograflar.html">Fotoğraflarımız</a>
    <a class="m3" href="fiyatlar.html">Fiyatlarımız</a>
    <a class="m4" href="rezervasyon.html">Rezervasyon</a>
    <a class="m5" href="dilek.html">Dilek / İstek</a>
    <a class="m6" href="takip.html">Bizi Takip Edin</a>
  </div>

</div>

<script>
if(localStorage.getItem("welcomeShown")){
  document.getElementById("welcome").style.display="none";
}else{
  localStorage.setItem("welcomeShown","1");
}
</script>

</body>
</html>
