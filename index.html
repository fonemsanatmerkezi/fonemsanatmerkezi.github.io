<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonem Sanat Merkezi</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("assets/bg.jpeg") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* HOŞ GELDİNİZ */
    #welcome {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 500;
      z-index: 99;
      animation: fadeOut 3s forwards;
      animation-delay: 2s;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* ANA ALAN */
    .menu-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
    }

    /* ORTA LOGO */
    .center-logo {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 110px;
      height: 110px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      z-index: 2;
    }

    .center-logo img {
      width: 70%;
    }

    /* BUTONLAR */
    .menu-btn {
      position: absolute;
      width: 140px;
      padding: 12px 0;
      background: #fff;
      border-radius: 999px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
      transition: all .2s ease;
      user-select: none;
    }

    .menu-btn:hover {
      background: #f5f0ff;
    }

    .menu-btn:active {
      transform: scale(.96);
    }

    /* KONUMlar */
    .b1 { top: -10px; left: 50%; transform: translateX(-50%); }
    .b2 { top: 70px; right: -10px; }
    .b3 { bottom: 70px; right: -10px; }
    .b4 { bottom: -10px; left: 50%; transform: translateX(-50%); }
    .b5 { bottom: 70px; left: -10px; }
    .b6 { top: 70px; left: -10px; }

    @media (max-width: 480px) {
      .menu-wrapper {
        width: 280px;
        height: 280px;
      }

      .menu-btn {
        width: 130px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div id="welcome">Fonem Sanat Merkezi’ne Hoş Geldiniz</div>

  <div class="menu-wrapper">

    <div class="center-logo">
      <img src="assets/logo.png" alt="Fonem">
    </div>

    <div class="menu-btn b1" data-link="karaoke.html">Karaoke Şarkı Hatırlatıcı</div>
    <div class="menu-btn b2" data-link="fotograflar.html">Fotoğraflarımız</div>
    <div class="menu-btn b3" data-link="rezervasyon.html">Rezervasyon</div>
    <div class="menu-btn b4" data-link="takip.html">Bizi Takip Edin</div>
    <div class="menu-btn b5" data-link="dilek.html">Dilek / Öneri</div>
    <div class="menu-btn b6" data-link="fiyatlar.html">Fiyatlarımız</div>

  </div>

  <script src="app.js"></script>
</body>
</html>
