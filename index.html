<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fonem Sanat Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Montserrat', sans-serif;
    }

    body{
      height:100vh;
      background:url("assets/github-arka-plan.jpeg") center/cover no-repeat fixed;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* HOŞGELDİNİZ */
    #welcome{
      position:fixed;
      top:40%;
      left:50%;
      transform:translate(-50%, -50%);
      font-size:36px;
      color:white;
      letter-spacing:2px;
      z-index:999;
      animation:fadeOut 3s forwards;
    }

    @keyframes fadeOut{
      0%{opacity:1;}
      70%{opacity:1;}
      100%{opacity:0; visibility:hidden;}
    }

    /* ANA ALAN */
    .container{
      position:relative;
      width:100%;
      height:100%;
    }

    /* PLAK */
    .record{
      position:absolute;
      top:50%;
      left:50%;
      width:220px;
      height:220px;
      transform:translate(-50%, -50%);
      border-radius:50%;
      background:
        radial-gradient(circle,
          #222 0%,
          #111 40%,
          #000 70%);
      border:4px solid #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      animation:spin 6s linear infinite;
      z-index:10;
    }

    /* LOGO */
    .record img{
      width:75%;
      height:75%;
      object-fit:contain;
      pointer-events:none;
    }

    @keyframes spin{
      from{
        transform:translate(-50%, -50%) rotate(0deg);
      }
      to{
        transform:translate(-50%, -50%) rotate(360deg);
      }
    }

  </style>
</head>

<body>

  <!-- HOŞGELDİNİZ -->
  <div id="welcome">HOŞGELDİNİZ</div>

  <div class="container">

    <!-- PLAK + LOGO -->
    <div class="record">
      <img src="assets/fonem-logo.png" alt="Fonem Logo">
    </div>

  </div>

</body>
</html>
