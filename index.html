<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
/* ========== GENEL ========== */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* ========== AÇILIŞ ========== */
#splash {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("github-arka-plan.jpeg") center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#splash h1 {
  font-family: 'Pacifico', cursive;
  font-size: 40px;
  margin-top: 24px;
}

/* ========== LOGO ========== */
.logo {
  width: 100%;
  max-width: 520px;   /* GERÇEK BÜYÜKLÜK */
  margin: 0 auto 32px;
}

/* ========== ANA ALAN ========== */
.container {
  max-width: 460px;
  margin: 0 auto;
  padding: 120px 20px 40px;
}

/* ========== BUTONLAR (GÖRSEL ETKİLİ) ========== */
.btn {
  width: 100%;
  padding: 18px;
  margin: 14px 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  color: #222;
  background: linear-gradient(135deg, #f7f7f2, #e6e6df);
  box-shadow:
    0 8px 20px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.6);
  transition: all 0.25s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 12px 26px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.8);
}

.btn:active {
  transform: translateY(0);
  box-shadow:
    0 6px 14px rgba(0,0,0,0.4);
}

/* ========== ALT ========== */
.footer {
  margin-top: 40px;
  font-size: 13px;
  opacity: 0.7;
}

/* ========== MOBİL AYAR ========== */
@media (max-width: 480px) {
  .logo {
    max-width: 360px;
  }
}
</style>
</head>

<body>

<!-- AÇILIŞ -->
<div id="splash">
  <img src="fonem-logo.png" alt="Fonem Logo" class="logo">
  <h1>Hoş Geldiniz</h1>
</div>

<!-- ANA SAYFA -->
<div class="container">
  <img src="fonem-logo.png" alt="Fonem Logo" class="logo">

  <button class="btn">🎤 Karaoke Sanatçı Hatırlatıcı</button>
  <button class="btn">🎶 Karaoke Şarkı Hatırlatıcı</button>
  <button class="btn">💸 Fiyatlarımız</button>
  <button class="btn">📅 Rezervasyon Yap</button>
  <button class="btn">📝 Dilek – İstek – Öneri</button>
  <button class="btn">📲 Bizi Takip Edin</button>

  <div class="footer">© Fonem Sanat Merkezi</div>
</div>

<script>
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
}, 3000);
</script>

</body>
</html>
