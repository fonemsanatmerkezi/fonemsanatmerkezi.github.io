<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("assets/github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* HOŞ GELDİNİZ */
#welcome{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:22px;
  letter-spacing:1px;
  opacity:0;
  animation:welcomeFade 3s ease forwards;
  pointer-events:none;
}
@keyframes welcomeFade{
  0%{opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{opacity:0}
}

/* ANA KAPSAYICI */
.wrapper{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* PLAK */
.record{
  width:210px;
  height:210px;
  border-radius:50%;
  background:
    radial-gradient(circle,#111 38%,#000 39%);
  border:4px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 35px rgba(255,255,255,.25);
  animation:spin 14s linear infinite;
  margin-bottom:28px;
}
@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

.record img{
  width:95%;
  border-radius:50%;
}

/* MENÜ */
.menu{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* BUTON */
.menu a{
  text-decoration:none;
  color:#000;
  background:#fff;
  border-radius:18px;
  padding:12px;
  text-align:center;
  font-weight:600;
  box-shadow:
    0 8px 18px rgba(0,0,0,.35),
    0 0 0 rgba(255,255,255,0);
  transition:
    box-shadow .25s ease,
    filter .25s ease,
    transform .12s ease;
}

/* HAFİF BÜYÜME + NEON */
.menu a:hover{
  filter:brightness(1.12);
  box-shadow:
    0 10px 22px rgba(0,0,0,.4),
    0 0 18px rgba(255,255,255,.7);
}

.menu a:active{
  transform:scale(.97);
}

/* LINKLERİN ALTINI ÇİZMEYİ ENGELLE */
.menu a span{
  text-decoration:none;
}
</style>
</head>

<body>

<div id="welcome">Hoş Geldiniz</div>

<div class="wrapper">

  <!-- PLAK -->
  <div class="record">
    <img src="assets/fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- MENÜ -->
  <nav class="menu">
    <a href="karaoke.html"><span>Şarkı Hatırlatıcı</span></a>
    <a href="fotograflar.html"><span>Fotoğraflarımız</span></a>
    <a href="fiyatlar.html"><span>Fiyatlarımız</span></a>
    <a href="rezervasyon.html"><span>Rezervasyon</span></a>
    <a href="dilek.html"><span>Dilek / İstek / Öneri</span></a>
    <a href="takip.html"><span>Bizi Takip Edin</span></a>
  </nav>

</div>

<script>
/* Hoşgeldiniz sadece ilk girişte */
if(localStorage.getItem("welcomeShown")){
  document.getElementById("welcome").style.display="none";
}else{
  localStorage.setItem("welcomeShown","1");
}
</script>

</body>
</html>
