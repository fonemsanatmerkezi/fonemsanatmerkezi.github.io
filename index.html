<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fonem Sanat Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* LOGO */
    #header {
      margin-top: 20px;
      text-align: center;
    }

    #header img {
      width: 160px;
      max-width: 90%;
    }

    /* BAŞLIK */
    #welcome {
      text-align: center;
      margin: 15px 0 30px 0;
    }

    #welcome h1 {
      font-size: 28px;
      margin: 0;
    }

    #welcome p {
      font-size: 16px;
      margin: 6px 0 0 0;
      opacity: 0.8;
    }

    /* ANA ALAN */
    #content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
    }

    /* SAYFALAR */
    .page {
      display: none;
      width: 100%;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .artist-list p {
      margin: 6px 0;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div id="header">
    <img src="fonem tabela transparent.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- BAŞLIK -->
  <div id="welcome">
    <h1>Fonem Sanat Merkezi</h1>
    <p>Hoş Geldiniz</p>
  </div>

  <!-- İÇERİK -->
  <div id="content">

    <!-- ANA MENÜ -->
    <div id="menu" class="page" style="display:block;">
      <button class="btn" onclick="showArtists()">Karaoke Sanatçı Listesi</button>
      <button class="btn">Menü & Fiyatlar</button>
      <button class="btn">Şarkı Hatırlatıcı</button>
    </div>

    <!-- SANATÇI LİSTESİ -->
    <div id="artists" class="page">
      <input type="text" placeholder="Sanatçı ara...">

      <div class="artist-list">
        <p>Ajda Pekkan</p>
        <p>Barış Manço</p>
        <p>Cem Karaca</p>
        <p>Sezen Aksu</p>
        <p>Tarkan</p>
      </div>

      <button class="btn" onclick="goBack()">Geri</button>
    </div>

  </div>

  <script>
    function showArtists() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("artists").style.display = "block";
    }

    function goBack() {
      document.getElementById("artists").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }
  </script>

</body>
</html>
