<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<!-- Google Fonts Modern -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)), url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}

/* Hoş Geldiniz Mesajı Üstte */
#welcome{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:34px;
  font-weight:700;
  color:#ffffff;
  opacity:1;
  animation: fadeOut 3s ease forwards 3s;
  z-index:999;
  text-align:center;
}

@keyframes fadeOut{
  0% { opacity:1; }
  100% { opacity:0; transform:translateY(-30px); }
}

/* Container */
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
  margin-top:60px;
}

/* Logo */
.logo{
  text-align:center;
  margin:20px 0 25px;
}
.logo img{
  max-width:220px;
  height:auto;
  display:block;
  margin:auto;
}

/* Butonlar alt alta, eşit en, modern gölgeli */
.btn{
  display:block;
  width:280px; /* biraz daha uzun */
  padding:12px;
  margin:10px auto; /* ortada alt alta */
  font-size:16px;
  border-radius:16px;
  border:none;
  background:#fff;
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:0.2s ease-in-out;
  text-align:center;
  box-shadow:0 6px 12px rgba(0,0,0,0.25);
  text-decoration:none; /* alt çizgi yok */
}
.btn:hover{
  background:#f5f5f5;
  box-shadow:0 8px 16px rgba(0,0,0,0.3);
}
.btn:active{
  background:#e0e0e0;
  transform:scale(0.97);
}

/* Özel butonlar altı çizgi olmasın */
a.btn{
  text-decoration:none;
}

/* Responsive */
@media screen and (max-width:400px){
  #welcome{
    font-size:28px;
  }
  .btn{
    width:220px;
    font-size:15px;
    padding:10px;
  }
}
</style>
</head>
<body>

<!-- Hoş Geldiniz Mesajı -->
<div id="welcome">Hoş Geldiniz!</div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img src="fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- Butonlar ALT ALTA -->
  <a href="karaoke.html"><button class="btn">🎤 Karaoke Hatırlatıcı</button></a>
  <a href="fotograflar.html"><button class="btn">📸 Fotoğraflarımız</button></a>
  <a href="fiyatlar.html"><button class="btn">💰 Fiyatlarımız</button></a>
  <a href="rezervasyon.html"><button class="btn">📅 Rezervasyon</button></a>
  <a href="dilek.html"><button class="btn">📝 Dilek / İstek / Öneri</button></a>
  <button class="btn">📲 Bizi Takip Edin</button>

</div>

<script>
// 3 saniye sonra hoşgeldiniz mesajını kaldır
setTimeout(() => {
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
}, 6000);
</script>

</body>
</html>
