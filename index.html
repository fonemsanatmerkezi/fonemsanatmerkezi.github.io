<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("github-arka-plan.jpeg") center/cover fixed;
  height:100vh;
  overflow:hidden;
  font-family:'Poppins', sans-serif;
}

/* Hoşgeldiniz */
#welcome{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Playfair Display', serif;
  font-size:36px;
  color:#fff;
  background:rgba(0,0,0,.6);
  z-index:10;
  animation:fadeOut 3s forwards;
}

@keyframes fadeOut{
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0; visibility:hidden}
}

.main{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

svg{
  width:340px;
  max-width:90vw;
}

/* Dilimler */
.slice{
  fill:#ffffff;
  cursor:pointer;
  transition:.2s;
}
.slice:hover{
  fill:#f3e5f5;
}

/* Çizgiler */
.lines{
  stroke:#9c27b0;
  stroke-width:2;
}
.outer{
  fill:none;
  stroke:#9c27b0;
  stroke-width:4;
}

/* Yazılar */
.slice-text{
  fill:#000;
  font-size:14px;
  font-weight:600;
  text-anchor:middle;
  dominant-baseline:middle;
}

/* Orta */
.center-circle{ fill:#fff; }
</style>
</head>

<body>

<div id="welcome">Hoş Geldiniz</div>

<div class="main">
<svg viewBox="0 0 300 300">

  <!-- Dış Çember -->
  <circle cx="150" cy="150" r="135" class="outer"/>

  <!-- DİLİMLER -->
  <g onclick="go('karaoke.html')">
    <path class="slice" d="M150 150 L150 15 A135 135 0 0 1 265 85 Z"/>
    <text class="slice-text" x="190" y="70">Karaoke</text>
  </g>

  <g onclick="go('fotograflar.html')">
    <path class="slice" d="M150 150 L265 85 A135 135 0 0 1 265 215 Z"/>
    <text class="slice-text" x="225" y="150">Fotoğraflar</text>
  </g>

  <g onclick="go('rezervasyon.html')">
    <path class="slice" d="M150 150 L265 215 A135 135 0 0 1 150 285 Z"/>
    <text class="slice-text" x="190" y="230">Rezervasyon</text>
  </g>

  <g onclick="go('takip.html')">
    <path class="slice" d="M150 150 L150 285 A135 135 0 0 1 35 215 Z"/>
    <text class="slice-text" x="110" y="230">Takip</text>
  </g>

  <g onclick="go('dilek.html')">
    <path class="slice" d="M150 150 L35 215 A135 135 0 0 1 35 85 Z"/>
    <text class="slice-text" x="75" y="150">Dilek</text>
  </g>

  <g onclick="go('fiyatlar.html')">
    <path class="slice" d="M150 150 L35 85 A135 135 0 0 1 150 15 Z"/>
    <text class="slice-text" x="110" y="70">Fiyatlar</text>
  </g>

  <!-- Ayırıcılar -->
  <line x1="150" y1="15" x2="150" y2="285" class="lines"/>
  <line x1="35" y1="85" x2="265" y2="215" class="lines"/>
  <line x1="265" y1="85" x2="35" y2="215" class="lines"/>

  <!-- Orta -->
  <circle cx="150" cy="150" r="38" class="center-circle"/>
  <image href="fonem-logo.png" x="122" y="122" width="56"/>

</svg>
</div>

<audio id="clickSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8a1d4c7d9e.mp3">
</audio>

<script>
function go(url){
  const s=document.getElementById("clickSound");
  s.currentTime=0;
  s.play();
  setTimeout(()=>location.href=url,180);
}
</script>

</body>
</html>
