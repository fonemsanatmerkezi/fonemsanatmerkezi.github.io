<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
  color: #f2f2f2;
  text-align: center;
}

/* AÇILIŞ */
#splash {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("github-arka-plan.jpeg") center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#splash h1 {
  font-family: 'Pacifico', cursive;
  font-size: 36px;
  margin-top: 20px;
}

/* LOGO */
.logo {
  max-width: 660px;
  width: 100%;
  margin-bottom: 34px;
}

}

/* ANA ALAN */
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 120px 20px 40px;
}

/* BUTONLAR */
.btn {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  font-size: 17px;
  background: #f5f5f0;
  color: #222;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.btn:hover {
  background: #eaeae5;
}

.footer {
  margin-top: 40px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- AÇILIŞ -->
<div id="splash">
  <img src="fonem-logo.png" alt="Fonem Logo" class="logo">
  <h1>Hoş Geldiniz</h1>
</div>

<!-- ANA SAYFA -->
<div class="container">
  <img src="fonem-logo.png" alt="Fonem Logo" class="logo">

  <button class="btn">🎤 Karaoke Sanatçı Hatırlatıcı</button>
  <button class="btn">🎶 Karaoke Şarkı Hatırlatıcı</button>
  <button class="btn">💸 Fiyatlarımız</button>
  <button class="btn">📅 Rezervasyon Yap</button>
  <button class="btn">📝 Dilek – İstek – Öneri</button>
  <button class="btn">📲 Bizi Takip Edin</button>

  <div class="footer">© Fonem Sanat Merkezi</div>
</div>

<script>
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
}, 3000);
</script>

</body>
</html>
