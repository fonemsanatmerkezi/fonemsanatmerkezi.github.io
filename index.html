<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

#splash {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("github-arka-plan.jpeg") center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#splash h1 {
  font-family: 'Pacifico', cursive;
  font-size: 40px;
  margin-top: 24px;
}

.logo {
  width: 100%;
  max-width: 520px;
  margin: 0 auto 32px;
}

.container {
  max-width: 460px;
  margin: 0 auto;
  padding: 120px 20px 40px;
}

.btn {
  display: block;
  text-decoration: none;
  width: 100%;
  padding: 18px;
  margin: 14px 0;
  font-size: 17px;
  font-weight: 600;
  border-radius: 14px;
  color: #222;
  background: linear-gradient(135deg, #f7f7f2, #e6e6df);
  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}

.footer {
  margin-top: 40px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div id="splash">
  <img src="fonem-logo.png" class="logo">
  <h1>Hoş Geldiniz</h1>
</div>

<div class="container">
  <img src="fonem-logo.png" class="logo">

  <!-- ARTIK LİNK -->
  <a href="sanatcilar.html" class="btn">🎤 Karaoke Sanatçı Hatırlatıcı</a>

  <a href="#" class="btn">🎶 Karaoke Şarkı Hatırlatıcı</a>
  <a href="#" class="btn">💸 Fiyatlarımız</a>
  <a href="#" class="btn">📅 Rezervasyon Yap</a>
  <a href="#" class="btn">📝 Dilek – İstek – Öneri</a>
  <a href="#" class="btn">📲 Bizi Takip Edin</a>

  <div class="footer">© Fonem Sanat Merkezi</div>
</div>

<script>
setTimeout(() => {
  const splash = document.getElementById("splash");
  splash.style.opacity = "0";
  splash.style.pointerEvents = "none";
}, 3000);
</script>

</body>
</html>
