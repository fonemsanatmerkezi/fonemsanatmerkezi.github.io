<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Karaoke Hatırlatıcı</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f5f5f5;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* LOGO */
.logo {
  max-width: 520px;
  width: 100%;
  margin: 40px auto 30px;
}

/* KONTEYNER */
.container {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

/* BUTON */
.btn {
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  font-size: 17px;
  font-weight: 600;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  color: #222;
  background: linear-gradient(135deg, #f7f7f2, #e6e6df);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* BÖLÜMLER */
.section {
  display: none;
  margin-top: 30px;
}

/* LİSTE */
.list {
  text-align: left;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}

.item {
  padding: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.item:last-child {
  border-bottom: none;
}

.footer {
  margin: 30px 0 10px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<img src="fonem-logo.png" class="logo">

<div class="container">

  <!-- ANA BUTON -->
  <button class="btn" onclick="openStyles()">🎤 Karaoke Hatırlatıcı</button>

  <!-- TARZLAR -->
  <div id="styles" class="section">
    <h3>Tarz Seç</h3>
    <button class="btn" onclick="openTurkPop()">Türk Pop</button>
  </div>

  <!-- TÜRK POP SANATÇILARI -->
  <div id="turkPop" class="section">
    <h3>Türk Pop Sanatçıları</h3>
    <div class="list" id="artistList"></div>
  </div>

  <div class="footer">© Fonem Sanat Merkezi</div>
</div>

<script>
/* TÜRK POP SANATÇILARI */
const turkPopArtists = [
  "Tarkan",
  "Sezen Aksu",
  "Ajda Pekkan",
  "Kenan Doğulu",
  "Sertab Erener",
  "Nilüfer",
  "Levent Yüksel",
  "Gülşen",
  "Mustafa Sandal",
  "Hadise"
];

/* TARZLARI AÇ */
function openStyles() {
  document.getElementById("styles").style.display = "block";
  document.getElementById("turkPop").style.display = "none";
}

/* TÜRK POP AÇ */
function openTurkPop() {
  const list = document.getElementById("artistList");
  list.innerHTML = "";
  turkPopArtists.forEach(name => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = name;
    list.appendChild(div);
  });
  document.getElementById("turkPop").style.display = "block";
}
</script>

</body>
</html>
