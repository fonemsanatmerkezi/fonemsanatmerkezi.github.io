<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* LOGO */
.logo {
  width: 100%;
  max-width: 520px;
  margin: 40px auto 30px;
  display: block;
}

/* KONTEYNER */
.container {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

/* BUTONLAR */
.btn {
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  font-size: 17px;
  font-weight: 600;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  color: #222;
  background: linear-gradient(135deg, #f7f7f2, #e6e6df);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 26px rgba(0,0,0,0.5);
}

/* ALT YAZI */
.footer {
  margin: 30px 0 10px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- LOGO -->
<img src="fonem-logo.png" alt="Fonem Sanat Merkezi" class="logo">

<div class="container">

  <!-- BUTONLAR -->
  <button class="btn" onclick="location.href='karaoke.html'">
    🎤 Karaoke Hatırlatıcı
  </button>

  <button class="btn" onclick="location.href='fotograflar.html'">
    📸 Fotoğraflar
  </button>

  <button class="btn">
    💸 Fiyatlarımız
  </button>

  <button class="btn">
    📅 Rezervasyon Yap
  </button>

  <button class="btn">
    📝 Dilek – İstek – Öneri
  </button>

  <button class="btn">
    📲 Bizi Takip Edin
  </button>

  <div class="footer">
    © Fonem Sanat Merkezi
  </div>

</div>

</body>
</html>
