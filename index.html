<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* AÇILIŞ */
#splash {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("github-arka-plan.jpeg") center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#splash h1 {
  font-family: 'Pacifico', cursive;
  font-size: 40px;
  margin-top: 24px;
}

/* LOGO */
.logo {
  width: 100%;
  max-width: 520px;
  margin: 0 auto 32px;
}

/* ANA */
.container {
  max-width: 460px;
  margin: 0 auto;
  padding: 120px 20px 40px;
}

/* BUTON */
.btn {
  width: 100%;
  padding: 18px;
  margin: 14px 0;
  font-size: 17px;
  font-weight: 600;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  color: #222;
  background: linear-gradient(135deg, #f7f7f2, #e6e6df);
  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}

/* SANATÇI ARAMA */
#artistSection {
  display: none;
  margin-top: 30px;
}

.search-input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  margin-bottom: 16px;
}

.artist-list {
  text-align: left;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 10px;
  max-height: 320px;
  overflow-y: auto;
}

.artist-item {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.artist-item:last-child {
  border-bottom: none;
}

.footer {
  margin-top: 40px;
  font-size: 13px;
  opacity: 0.7;
}

@media (max-width: 480px) {
  .logo { max-width: 360px; }
}
</style>
</head>

<body>

<!-- AÇILIŞ -->
<div id="splash">
  <img src="fonem-logo.png" class="logo">
  <h1>Hoş Geldiniz</h1>
</div>

<!-- ANA -->
<div class="container">
  <img src="fonem-logo.png" class="logo">

  <button class="btn" onclick="toggleArtists()">🎤 Karaoke Sanatçı Hatırlatıcı</button>

  <!-- SANATÇI ARAMA -->
  <div id="artistSection">
    <input
      type="text"
      class="search-input"
      placeholder="Sanatçı ara..."
      onkeyup="filterArtists(this.value)"
    >

    <div class="artist-list" id="artistList"></div>
  </div>

  <div class="footer">© Fonem Sanat Merkezi</div>
</div>

<script>
/* AÇILIŞ */
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
}, 3000);

/* SANATÇI LİSTESİ (ÖRNEK) */
const artists = [
  "Ajda Pekkan",
  "Athena",
  "Barış Manço",
  "Cem Adrian",
  "Duman",
  "Edis",
  "Ezhel",
  "MFÖ",
  "Müslüm Gürses",
  "Sezen Aksu",
  "Teoman",
  "Tarkan",
  "Zeki Müren"
].sort();

/* LİSTEYİ BAS */
const listEl = document.getElementById("artistList");
function renderList(list) {
  listEl.innerHTML = "";
  list.forEach(a => {
    const div = document.createElement("div");
    div.className = "artist-item";
    div.textContent = a;
    listEl.appendChild(div);
  });
}
renderList(artists);

/* ARAMA */
function filterArtists(value) {
  const v = value.toLowerCase();
  const filtered = artists.filter(a => a.toLowerCase().includes(v));
  renderList(filtered);
}

/* AÇ / KAPA */
function toggleArtists() {
  const sec = document.getElementById("artistSection");
  sec.style.display = sec.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
