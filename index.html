<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

/* ANA ALAN */
.main{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* DAİRE KONTEYNER */
.circle-container{
  position:relative;
  width:320px;
  height:320px;
}

/* ORTA LOGO */
.center-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:110px;
  height:110px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}

.center-logo img{
  width:80px;
}

/* BUTONLAR */
.circle-btn{
  position:absolute;
  width:160px;
  height:42px;
  background:#fff;
  color:#4a148c;
  border-radius:22px;
  border:2px solid #9c27b0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  box-shadow:0 6px 16px rgba(0,0,0,.35);
  transition:all .15s ease;
}

.circle-btn:active{
  background:#f3e5f5;
  transform:scale(.95);
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}

/* KONUM LANDIRMALAR */
.btn1{ top:-10px; left:50%; transform:translateX(-50%); }
.btn2{ top:70px; right:-10px; }
.btn3{ bottom:70px; right:-10px; }
.btn4{ bottom:-10px; left:50%; transform:translateX(-50%); }
.btn5{ bottom:70px; left:-10px; }
.btn6{ top:70px; left:-10px; }

/* MOBİL */
@media(max-width:420px){
  .circle-container{
    width:280px;
    height:280px;
  }
  .circle-btn{
    width:145px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="main">
  <div class="circle-container">

    <!-- ORTA LOGO -->
    <div class="center-logo">
      <img src="fonem-logo.png" alt="Fonem">
    </div>

    <!-- BUTONLAR -->
    <a href="karaoke.html" class="circle-btn btn1">Karaoke Şarkı Hatırlatıcı</a>
    <a href="fotograflar.html" class="circle-btn btn2">Fotoğraflarımız</a>
    <a href="rezervasyon.html" class="circle-btn btn3">Rezervasyon</a>
    <a href="takip.html" class="circle-btn btn4">Bizi Takip Edin</a>
    <a href="dilek.html" class="circle-btn btn5">Dilek / Öneri</a>
    <a href="fiyatlar.html" class="circle-btn btn6">Fiyatlarımız</a>

  </div>
</div>

</body>
</html>
