<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>
<style>
body{
  margin:0;
  font-family:'Arial', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)), url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}

/* Hoş Geldiniz Mesajı */
#welcome{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:36px;
  font-weight:700;
  color:#ffffff;
  font-family:'Courier New', Courier, monospace;
  opacity:1;
  animation: fadeOut 3s ease forwards 3s;
  z-index:999;
  text-align:center;
}

@keyframes fadeOut{
  0% { opacity:1; }
  100% { opacity:0; transform:translate(-50%, -60%); }
}

/* Container */
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* Logo */
.logo{
  text-align:center;
  margin:30px 0 25px;
}
.logo img{
  max-width:220px;
  height:auto;
  display:block;
  margin:auto;
}

/* Butonlar alt alta ve aynı genişlikte */
.btn{
  display:block;
  width:100%; /* Tüm butonlar aynı genişlik */
  padding:12px 14px;
  margin-bottom:12px;
  font-size:16px;
  border-radius:14px;
  border:none;
  background:#fff;
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:0.15s ease-in-out;
  text-align:center;
  box-shadow:0 3px 6px rgba(0,0,0,0.2);
}
.btn:hover{
  background:#f0f0f0;
}
.btn:active{
  background:#e0e0e0;
  transform:scale(0.97); /* Hafif gömülme hissi */
}

/* Responsive */
@media screen and (max-width:400px){
  #welcome{
    font-size:28px;
  }
  .btn{
    font-size:14px;
    padding:10px 12px;
  }
}
</style>
</head>
<body>

<!-- Hoş Geldiniz Mesajı -->
<div id="welcome">Hoş Geldiniz!</div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img src="fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- ANA BUTONLAR ALT ALTA -->
  <a href="karaoke.html"><button class="btn">🎤 Karaoke Hatırlatıcı</button></a>
  <a href="fotograflar.html"><button class="btn">📸 Fotoğraflarımız</button></a>
  <a href="fiyatlar.html"><button class="btn">💰 Fiyatlarımız</button></a>
  <button class="btn">📅 Rezervasyon</button>
  <button class="btn">📝 Dilek / İstek / Öneri</button>
  <button class="btn">📲 Bizi Takip Edin</button>

</div>

<script>
// 3 saniye sonra hoş geldiniz mesajını kaldır
setTimeout(() => {
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
}, 6000); // fadeOut animasyon + ek süre
</script>

</body>
</html>
