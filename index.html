<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>
<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* HOŞ GELDİN MESAJI */
#hosgeldiniz{
  text-align:center;
  padding:12px;
  background:#0288d1;
  color:#fff;
  font-weight:bold;
  border-radius:8px;
  margin:10px auto;
  max-width:300px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}

/* Mevcut ana sayfa stillerini bozmamak için varsayılan örnek */
.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
  text-align:center;
}

/* Örnek butonlar */
button{
  padding:10px 20px;
  font-size:14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}

</style>
</head>
<body>

<!-- HOŞ GELDİN MESAJI -->
<div id="hosgeldiniz">Hoş Geldiniz!</div>

<!-- Mevcut ana sayfa içeriği -->
<div class="container">
  <h1>Fonem Sanat Merkezi</h1>
  <p>Buraya ana sayfa içeriğiniz gelecek.</p>
  <button onclick="window.location.href='karaoke.html'">Karaoke</button>
  <button onclick="window.location.href='fotograflar.html'">Fotoğraflar</button>
</div>

<script>
/* HOŞ GELDİN MESAJI 3 SANİYE SONRA KAYBOLSUN */
window.addEventListener('load', () => {
  const mesaj = document.getElementById('hosgeldiniz');
  setTimeout(() => { 
    mesaj.style.display='none'; 
  }, 3000);
});
</script>

</body>
</html>
