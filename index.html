<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  min-height:100vh;
  background:url("assets/bg.jpg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

/* KARARTMA */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:-1;
}

/* ANA KONTEYNER */
.main{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
}

/* PLAK */
.vinyl{
  width:260px;
  height:260px;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 2px,
      #1a1a1a 3px,
      #111 4px
    );
  position:relative;
  animation:spin 14s linear infinite;
  box-shadow:
    0 0 25px rgba(255,255,255,.15),
    0 0 60px rgba(255,255,255,.08);
}

/* NEON HALKA */
.vinyl::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.6);
  box-shadow:0 0 18px rgba(255,255,255,.4);
}

/* ORTA ETİKET */
.label{
  position:absolute;
  inset:0;
  margin:auto;
  width:55%;
  height:55%;
  background:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.label img{
  width:90%;
  height:90%;
  object-fit:contain;
  border-radius:50%;
}

/* MERKEZ DELİK */
.vinyl::after{
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:6px;
  height:6px;
  background:#000;
  border-radius:50%;
  z-index:10;
}

/* BUTONLAR */
.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
}

.btn{
  width:240px;
  padding:12px;
  text-align:center;
  color:#000;
  background:#fff;
  border-radius:30px;
  font-weight:500;
  letter-spacing:.5px;
  box-shadow:
    0 6px 18px rgba(0,0,0,.3),
    inset 0 0 0 rgba(255,255,255,0);
  transition:.25s ease;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 10px 30px rgba(255,255,255,.35);
}

.btn:active{
  transform:scale(.96);
}

/* DÖNÜŞ */
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<audio id="clickSound" src="assets/click.mp3"></audio>

<div class="main">

  <!-- PLAK -->
  <div class="vinyl">
    <div class="label">
      <img src="assets/logo.png" alt="Fonem">
    </div>
  </div>

  <!-- BUTONLAR -->
  <div class="menu">
    <a href="karaoke.html"><div class="btn">Şarkı Hatırlatıcı</div></a>
    <a href="foto.html"><div class="btn">Fotoğraflarımız</div></a>
    <a href="fiyat.html"><div class="btn">Fiyatlarımız</div></a>
    <a href="rezervasyon.html"><div class="btn">Rezervasyon</div></a>
    <a href="dilek.html"><div class="btn">Dilek – İstek – Öneri</div></a>
    <a href="takip.html"><div class="btn">Bizi Takip Edin</div></a>
  </div>

</div>

<script>
const sound=document.getElementById("clickSound");
document.querySelectorAll(".btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    sound.currentTime=0;
    sound.play();
  });
});
</script>

</body>
</html>
