<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
             url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  overflow-x:hidden;
}

/* Hoş Geldiniz */
#welcome{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:34px;
  font-weight:700;
  animation: fadeOut 3s ease forwards 3s;
  z-index:999;
}
@keyframes fadeOut{
  to { opacity:0; transform:translate(-50%,-30px); }
}

/* Container */
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
  margin-top:80px;
}

/* Logo */
.logo img{
  max-width:220px;
  margin-bottom:30px;
}

/* ==== DAİRESEL MENÜ ==== */
.circle-menu{
  width:300px;
  height:300px;
  border-radius:50%;
  margin:40px auto;
  position:relative;
  border:4px solid #c40000; /* kırmızı çerçeve */
}

.center{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-weight:700;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.slice{
  position:absolute;
  width:50%;
  height:50%;
  transform-origin:100% 100%;
  background:#f4f1ec;
  border:none;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  color:#111;
}

.slice:hover{
  background:#ebe6dd;
}

/* Dilimler */
#karaoke { transform: rotate(0deg) translate(100%,0); }
#foto    { transform: rotate(60deg) translate(100%,0); }
#fiyat   { transform: rotate(120deg) translate(100%,0); }
#rezerv  { transform: rotate(180deg) translate(100%,0); }
#dilek   { transform: rotate(240deg) translate(100%,0); }
#takip   { transform: rotate(300deg) translate(100%,0); }

/* Mobil */
@media(max-width:600px){
  .circle-menu{ transform:scale(0.85); }
}
</style>
</head>

<body>

<div id="welcome">Hoş Geldiniz!</div>

<div class="container">

  <div class="logo">
    <img src="fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <div class="circle-menu">
    <div class="center">FONEM</div>

    <button class="slice" id="karaoke" onclick="go('karaoke.html')">🎤 Karaoke</button>
    <button class="slice" id="foto" onclick="go('fotograflar.html')">📸 Fotoğraflar</button>
    <button class="slice" id="fiyat" onclick="go('fiyatlar.html')">💰 Fiyatlar</button>
    <button class="slice" id="rezerv" onclick="go('rezervasyon.html')">📅 Rezervasyon</button>
    <button class="slice" id="dilek" onclick="go('dilek.html')">📝 Dilek</button>
    <button class="slice" id="takip" onclick="go('takip.html')">📲 Takip</button>
  </div>

</div>

<script>
setTimeout(()=>{ document.getElementById("welcome").style.display="none"; },6000);
function go(url){ window.location.href = url; }
</script>

</body>
</html>
