<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  height:100vh;
  background:url("assets/bg.jpeg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* karartma */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:-1;
}

/* hoşgeldiniz */
#welcome{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:300;
  letter-spacing:3px;
  background:rgba(0,0,0,.85);
  z-index:20;
  animation:fadeOut 3s forwards;
}

@keyframes fadeOut{
  0%{opacity:1}
  70%{opacity:1}
  100%{opacity:0; visibility:hidden}
}

/* ana alan */
.scene{
  position:relative;
  width:360px;
  height:360px;
}

/* plak */
.vinyl{
  width:220px;
  height:220px;
  border-radius:50%;
  background:repeating-radial-gradient(
    circle,
    #111 0px,
    #111 2px,
    #1a1a1a 3px,
    #111 4px
  );
  position:absolute;
  inset:0;
  margin:auto;
  animation:spin 14s linear infinite;
  box-shadow:
    0 0 25px rgba(255,255,255,.15);
}

/* plak neon */
.vinyl::before{
  content:"";
  position:absolute;
  inset:-5px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 0 18px rgba(255,255,255,.4);
}

/* etiket */
.label{
  position:absolute;
  inset:0;
  margin:auto;
  width:55%;
  height:55%;
  background:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.label img{
  width:90%;
  height:90%;
  object-fit:contain;
}

/* menü */
.menu{
  position:absolute;
  inset:0;
}

/* buton */
.menu a{
  position:absolute;
  width:140px;
  padding:10px;
  background:#fff;
  color:#000;
  text-align:center;
  border-radius:30px;
  text-decoration:none;
  font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  animation:pulse 2.5s infinite;
  transition:.25s;
}

.menu a:hover{
  transform:scale(1.05);
}

@keyframes pulse{
  0%{box-shadow:0 0 0 rgba(255,255,255,.6)}
  50%{box-shadow:0 0 18px rgba(255,255,255,.6)}
  100%{box-shadow:0 0 0 rgba(255,255,255,.6)}
}

/* konumlar */
.m1{top:0; left:50%; transform:translateX(-50%);}
.m2{top:25%; right:0;}
.m3{bottom:25%; right:0;}
.m4{bottom:0; left:50%; transform:translateX(-50%);}
.m5{bottom:25%; left:0;}
.m6{top:25%; left:0;}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div id="welcome">HOŞ GELDİNİZ</div>

<div class="scene">

  <div class="vinyl">
    <div class="label">
      <img src="assets/logo.png">
    </div>
  </div>

  <div class="menu">
    <a href="karaoke.html" class="m1">Şarkı Hatırlatıcı</a>
    <a href="fotograflar.html" class="m2">Fotoğraflarımız</a>
    <a href="fiyatlar.html" class="m3">Fiyatlarımız</a>
    <a href="rezervasyon.html" class="m4">Rezervasyon</a>
    <a href="dilek.html" class="m5">Dilek – İstek</a>
    <a href="takip.html" class="m6">Bizi Takip Edin</a>
  </div>

</div>

<script>
if(localStorage.getItem("welcomeShown")){
  document.getElementById("welcome").style.display="none";
}else{
  localStorage.setItem("welcomeShown","yes");
}
</script>

</body>
</html>
