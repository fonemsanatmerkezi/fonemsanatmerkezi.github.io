<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  margin:30px 0 25px;
}

.logo img{
  max-width:220px;
}

.btn{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  font-size:16px;
  border-radius:14px;
  border:none;
  background:#c62828;
  color:#fff;
  cursor:pointer;
}

.btn:hover{
  background:#b71c1c;
}

/* HOŞ GELDİN MESAJI */
#hosgeldiniz{
  text-align:center;
  padding:12px;
  background:#0288d1;
  color:#fff;
  font-weight:bold;
  border-radius:8px;
  margin:10px auto;
  max-width:300px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  font-size:16px;
}
</style>
</head>

<body>

<!-- HOŞ GELDİN MESAJI -->
<div id="hosgeldiniz">Hoş Geldiniz!</div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img src="fonem-logo.png" alt="Fonem Sanat Merkezi">
  </div>

  <!-- ANA BUTONLAR -->
  <a href="karaoke.html">
    <button class="btn">🎤 Karaoke Hatırlatıcı</button>
  </a>

  <button class="btn">📸 Fotoğraflarımız</button>
  <button class="btn">💰 Fiyatlarımız</button>
  <button class="btn">📅 Rezervasyon</button>
  <button class="btn">📝 Dilek / İstek / Öneri</button>
  <button class="btn">📲 Bizi Takip Edin</button>

</div>

<script>
/* HOŞ GELDİN MESAJI 3 SANİYE SONRA KAYBOLSUN */
window.addEventListener('load', () => {
  const mesaj = document.getElementById('hosgeldiniz');
  setTimeout(() => { 
    mesaj.style.display='none'; 
  }, 3000); // 3 saniye
});
</script>

</body>
</html>
