<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekan Fotoğrafları</title>
<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#111;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* Geri Butonu */
#geriBtn{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:#0288d1;
  color:#fff;
  cursor:pointer;
}

#geriBtn:active{
  background:#0277bd;
}

/* Galeri */
.galeri{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.galeri img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:transform .2s ease;
}

.galeri img:hover{
  transform:scale(1.05);
}

/* Modal */
#modal{
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#modalImg{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

#kapat{
  position:absolute;
  top:20px;
  right:30px;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
  <button id="geriBtn" onclick="window.location.href='index.html'">⬅ Ana Sayfa</button>

  <h2 style="text-align:center; margin-bottom:20px; font-size:22px; color:#0288d1;">Mekan Fotoğrafları</h2>

  <div class="galeri">
    <img src="fotograflarimiz/foto1.jpeg" alt="Mekan 1">
    <img src="fotograflarimiz/foto2.jpeg" alt="Mekan 2">
    <img src="fotograflarimiz/foto3.jpeg" alt="Mekan 3">
    <img src="fotograflarimiz/foto4.jpeg" alt="Mekan 4">
    <img src="fotograflarimiz/foto5.jpeg" alt="Mekan 5">
    <img src="fotograflarimiz/foto6.jpeg" alt="Mekan 6">
    <img src="fotograflarimiz/foto7.jpeg" alt="Mekan 7">
    <img src="fotograflarimiz/foto8.jpeg" alt="Mekan 8">
  </div>
</div>
<!-- FOTOĞRAF YÜKLEME ALANI -->
<div class="uploadBox">
  <label for="fotoInput" class="uploadBtn">📤 Fotoğraf Yükle</label>
  <input type="file" id="fotoInput" accept="image/*">
  <p id="uploadInfo">Sadece JPG / PNG – max 5 MB</p>
</div>

<!-- MODAL -->
<div id="modal">
  <span id="kapat">&times;</span>
  <img id="modalImg" src="">
</div>

<script>
// Modal elemanları
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const kapat = document.getElementById('kapat');

// Galeri fotoğraflarını seç
const fotos = document.querySelectorAll('.galeri img');

fotos.forEach(img => {
  img.addEventListener('click', () => {
    modal.style.display = 'flex';
    modalImg.src = img.src;
  });
});

// Kapat butonuna tıkla
kapat.addEventListener('click', () => {
  modal.style.display = 'none';
});

// Modal arka plana tıklayınca da kapat
modal.addEventListener('click', (e)=>{
  if(e.target === modal) modal.style.display='none';
});
</script>

</body>
</html>
