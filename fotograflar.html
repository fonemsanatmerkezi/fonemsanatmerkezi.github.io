<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekan Fotoğrafları</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#111;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* Geri Butonu */
#geriBtn{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:#0288d1;
  color:#fff;
  cursor:pointer;
}

#geriBtn:active{
  background:#0277bd;
}

/* FOTOĞRAF YÜKLEME ALANI */
.uploadBox{
  margin-bottom:20px;
  text-align:center;
}

.uploadBtn{
  display:block;
  background:#43a047;
  padding:14px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  color:#fff;
}

.uploadBtn:active{
  background:#388e3c;
}

#fotoInput{
  display:none;
}

.uploadInfo{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}

/* Galeri */
.galeri{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.galeri img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:transform .2s ease;
}

.galeri img:hover{
  transform:scale(1.05);
}

/* Modal */
#modal{
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#modalImg{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

#kapat{
  position:absolute;
  top:20px;
  right:30px;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <button id="geriBtn" onclick="window.location.href='index.html'">⬅ Ana Sayfa</button>

  <h2 style="margin-bottom:20px; font-size:22px; color:#0288d1;">Mekan Fotoğrafları</h2>

  <!-- FOTOĞRAF YÜKLEME -->
  <div class="uploadBox">
    <label for="fotoInput" class="uploadBtn">📤 Fotoğraf Yükle</label>
    <input type="file" id="fotoInput" accept="image/*">
    <p class="uploadInfo">Sadece JPG / PNG – max 5 MB</p>
  </div>

  <div class="galeri">
    <img src="fotograflarimiz/foto1.jpeg">
    <img src="fotograflarimiz/foto2.jpeg">
    <img src="fotograflarimiz/foto3.jpeg">
    <img src="fotograflarimiz/foto4.jpeg">
    <img src="fotograflarimiz/foto5.jpeg">
    <img src="fotograflarimiz/foto6.jpeg">
    <img src="fotograflarimiz/foto7.jpeg">
    <img src="fotograflarimiz/foto8.jpeg">
  </div>

</div>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfn39Tp6Z41XxNfocdId-NJ20YNrbZrr8",
    authDomain: "fonem-fotograflar.firebaseapp.com",
    projectId: "fonem-fotograflar",
    storageBucket: "fonem-fotograflar.firebasestorage.app",
    messagingSenderId: "602553440908",
    appId: "1:602553440908:web:e54ddef8f35c83e494b9a9"
  };

  firebase.initializeApp(firebaseConfig);
  const storage = firebase.storage();
</script>

<!-- MODAL -->
<div id="modal">
  <span id="kapat">&times;</span>
  <img id="modalImg">
</div>

<script>
// Modal elemanları
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const kapat = document.getElementById('kapat');

// Galeri fotoğrafları
document.querySelectorAll('.galeri img').forEach(img=>{
  img.onclick = ()=>{
    modal.style.display = 'flex';
    modalImg.src = img.src;
  }
});

kapat.onclick = ()=> modal.style.display='none';
modal.onclick = e=>{
  if(e.target === modal) modal.style.display='none';
};
</script>

</body>
</html>
