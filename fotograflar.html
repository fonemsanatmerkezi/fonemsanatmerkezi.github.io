<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekan Fotoğrafları</title>
<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#111;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* Geri Butonu */
#geriBtn{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:#0288d1;
  color:#fff;
  cursor:pointer;
}

#geriBtn:active{
  background:#0277bd;
}

/* Galeri */
.galeri{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.galeri img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:transform .2s ease;
}

.galeri img:hover{
  transform:scale(1.05);
}
</style>
</head>
<body>

<div class="container">
  <button id="geriBtn" onclick="window.location.href='index.html'">⬅ Ana Sayfa</button>

  <h2>Mekan Fotoğrafları</h2>

  <div class="galeri">
    <img src="fotograflarimiz/foto1.jpg" alt="Mekan 1">
    <img src="fotograflarimiz/foto2.jpg" alt="Mekan 2">
    <img src="fotograflarimiz/foto3.jpg" alt="Mekan 3">
    <img src="fotograflarimiz/foto4.jpg" alt="Mekan 4">
    <img src="fotograflarimiz/foto5.jpg" alt="Mekan 5">
    <img src="fotograflarimiz/foto6.jpg" alt="Mekan 6">
    <img src="fotograflarimiz/foto7.jpg" alt="Mekan 7">
    <img src="fotograflarimiz/foto8.jpg" alt="Mekan 8">
  </div>
</div>

</body>
</html>
