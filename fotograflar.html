<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekan Fotoğrafları</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#111;
  color:#fff;
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}
#geriBtn{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:#0288d1;
  color:#fff;
}
.uploadBtn{
  display:block;
  background:#43a047;
  padding:14px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  color:#fff;
}
#fotoInput{ display:none; }
.uploadInfo{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}
.galeri{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}
.galeri img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
}
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  justify-content:center;
  align-items:center;
}
#modal img{
  max-width:90%;
  max-height:90%;
}
#kapat{
  position:absolute;
  top:20px;
  right:30px;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <button id="geriBtn" onclick="location.href='index.html'">⬅ Ana Sayfa</button>
  <h2 style="color:#0288d1">Mekan Fotoğrafları</h2>

  <label class="uploadBtn" for="fotoInput">📤 Fotoğraf Yükle</label>
  <input type="file" id="fotoInput" accept="image/*">
  <p class="uploadInfo">Fotoğraflar onaydan sonra yayınlanır</p>
  <p id="durum"></p>

  <div class="galeri" id="galeri"></div>
</div>

<div id="modal">
  <span id="kapat">&times;</span>
  <img id="modalImg">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAfn39Tp6Z41XxNfocdId-NJ20YNrbZrr8",
  authDomain: "fonem-fotograflar.firebaseapp.com",
  projectId: "fonem-fotograflar",
  storageBucket: "fonem-fotograflar.firebasestorage.app",
  messagingSenderId: "602553440908",
  appId: "1:602553440908:web:e54ddef8f35c83e494b9a9"
});

const storage = firebase.storage();
const galeri = document.getElementById("galeri");
const durum = document.getElementById("durum");

/* ONAYLI FOTOĞRAFLAR */
storage.ref("onayli").listAll().then(res=>{
  res.items.forEach(item=>{
    item.getDownloadURL().then(url=>{
      const img = document.createElement("img");
      img.src = url;
      img.onclick = ()=>{
        modal.style.display="flex";
        modalImg.src = url;
      };
      galeri.appendChild(img);
    });
  });
});

/* FOTOĞRAF YÜKLE → BEKLEYEN */
document.getElementById("fotoInput").onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;

  durum.innerText = "⏳ Yükleniyor...";

  storage.ref("bekleyen/" + Date.now() + "_" + file.name)
    .put(file)
    .then(()=>{
      durum.innerText = "✅ Fotoğraf alındı. Onay bekliyor.";
    })
    .catch(err=>{
      durum.innerText = "❌ Yüklenemedi";
      alert(err.message);
    });

  e.target.value="";
};

/* MODAL */
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
document.getElementById("kapat").onclick = ()=>modal.style.display="none";
modal.onclick = e=>{ if(e.target===modal) modal.style.display="none"; }
</script>

</body>
</html>
