<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* ANA SAYFA BUTONU */
#anaSayfaBtn{
  position:fixed;
  top:10px;
  right:10px;
  background:#0288d1;
  color:#fff;
  border:none;
  border-radius:14px;
  padding:10px 16px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 3px 6px rgba(0,0,0,.4);
  z-index:10;
}
#anaSayfaBtn:active{
  background:#0277bd;
}

/* KATEGORİ BUTONLARI */
.kategoriler{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:20px;
  max-width:300px;
  margin:60px auto 20px auto; /* üstte ana sayfa butonundan boşluk */
}

.kategoriBtn{
  background:#c62828;
  color:#fff;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  width:100%; /* container genişliğine göre eşit */
  text-align:center;
  cursor:pointer;
  user-select:none;
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  transition:transform .1s ease, background-color .1s ease, box-shadow .1s ease;
}
.kategoriBtn:active{
  background:#a91f1f;
  transform:scale(.95);
  box-shadow:0 2px 4px rgba(0,0,0,.45);
}

/* SANATÇI LİSTESİ ALANI */
#sanatciAlan{
  display:none;
  max-width:400px;
  margin:20px auto;
}

#sanatciAlan #geriBtn{
  width:100%;
  height:36px;
  background:#c62828;
  border:none;
  border-radius:14px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  margin-bottom:10px;
}

#sanatciAlan #geriBtn:active{
  background:#a91f1f;
}

#sanatciAlan #arama{
  width:100%;
  height:36px;
  border-radius:14px;
  border:none;
  padding:0 12px;
  font-size:14px;
  margin-bottom:10px;
  display:block;
}

#sanatciAlan ul{
  list-style:none;
  padding:0;
  margin:0;
}

#sanatciAlan li{
  background:#1c1c1c;
  padding:10px;
  margin-bottom:6px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- ANA SAYFA BUTONU -->
<button id="anaSayfaBtn" onclick="window.location.href='index.html'">Ana Sayfa</button>

<!-- KATEGORİLER -->
<div id="kategoriAlan" class="kategoriler">
  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabanci')">Yabancı</div>
</div>

<!-- SANATÇI LİSTESİ -->
<div id="sanatciAlan">
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara..." oninput="aramaFiltre()">
  <ul id="liste"></ul>
</div>

<script>
let mevcutSanatcilar = [];

async function kategoriSec(kategori){
  document.getElementById('kategoriAlan').style.display = 'none';
  document.getElementById('sanatciAlan').style.display = 'block';
  document.getElementById('arama').value = '';
  mevcutSanatcilar = [];

  const liste = document.getElementById('liste');
  liste.innerHTML = '';

  if(kategori === 'pop'){
    try {
      const response = await fetch('pop.json');
      if(!response.ok) throw new Error('Dosya bulunamadı');
      const data = await response.json();
      if(!Array.isArray(data)) throw new Error('JSON array değil');
      mevcutSanatcilar = data;
      data.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        li.onclick = () => alert(s + ' seçildi');
        liste.appendChild(li);
      });
    } catch(err){
      console.error(err);
      liste.innerHTML = '<li>Sanatçı verisi yüklenemedi. Dosya yolu ve JSON formatını kontrol edin.</li>';
    }
  } else {
    const li = document.createElement('li');
    li.textContent = 'Sanatçı verisi henüz yok.';
    liste.appendChild(li);
  }
}

function geri(){
  document.getElementById('kategoriAlan').style.display = 'flex';
  document.getElementById('sanatciAlan').style.display = 'none';
  document.getElementById('liste').innerHTML = '';
  mevcutSanatcilar = [];
}

function aramaFiltre(){
  const arama = document.getElementById('arama').value.toLowerCase();
  const liste = document.getElementById('liste');
  liste.innerHTML = '';
  mevcutSanatcilar
    .filter(s => s.toLowerCase().includes(arama))
    .forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      li.onclick = () => alert(s + ' seçildi');
      liste.appendChild(li);
    });
}
</script>

</body>
</html>
