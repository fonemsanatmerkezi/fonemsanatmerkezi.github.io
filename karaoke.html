<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke</title>

<style>
:root{
  --lila:#9c7bff;
  --lila-dark:#7c5ce0;
  --white:#ffffff;
  --bg:#0e0e0e;
  --card:#1a1a1a;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:#fff;
}

/* ===== KATEGORİLER ===== */
.kategoriler{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:24px;
  max-width:300px;
  margin:60px auto 20px auto;
}

/* ANA SAYFA BUTONU */
#anaSayfaBtn{
  background:var(--white);
  color:#111;
  border:none;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  padding:6px 14px;
  cursor:pointer;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
#anaSayfaBtn:active{
  transform:scale(.95);
}

/* KATEGORİ BUTONLARI */
.kategoriBtn{
  width:100%;
  background:linear-gradient(145deg,var(--lila),var(--lila-dark));
  color:#fff;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  padding:9px 14px;
  text-align:center;
  cursor:pointer;
  box-shadow:
    0 6px 14px rgba(0,0,0,.45),
    0 0 0 rgba(156,123,255,0);
  transition:transform .12s ease, box-shadow .12s ease;
}

.kategoriBtn:hover{
  box-shadow:
    0 8px 18px rgba(0,0,0,.55),
    0 0 14px rgba(156,123,255,.35);
}

.kategoriBtn:active{
  transform:scale(.96);
}

/* ===== ORTA ALANLAR ===== */
#sanatciAlan,
#sarkiAlan,
#sozAlani{
  display:none;
  max-width:360px;
  margin:30px auto;
  padding:0 16px;
}

/* GERİ BUTONLARI (KATEGORİ İÇİ) */
#sanatciAlan button,
#sarkiAlan button,
#sozAlani button{
  background:#2a2a2a;
  color:#fff;
  border:none;
  border-radius:50px;
  padding:6px 14px;
  font-size:12px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
}
#sanatciAlan button:active,
#sarkiAlan button:active,
#sozAlani button:active{
  transform:scale(.95);
}

/* ARAMA */
#arama{
  width:100%;
  height:38px;
  border-radius:18px;
  border:none;
  padding:0 14px;
  font-size:14px;
  margin-bottom:12px;
  outline:none;
}

/* LİSTELER */
ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{
  background:var(--card);
  padding:12px;
  margin-bottom:8px;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  transition:background .12s ease, transform .12s ease;
}

li:hover{
  background:#242424;
}

li:active{
  transform:scale(.97);
}

/* ŞARKI SÖZÜ */
#sozListe{
  padding:16px;
  background:#202020;
  border-radius:16px;
  line-height:1.6;
}
</style>
</head>

<body>

<!-- KATEGORİLER -->
<div class="kategoriler">
  <button id="anaSayfaBtn" onclick="window.location.href='index.html'">Ana Sayfa</button>

  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabanci')">Yabancı</div>
</div>

<!-- SANATÇI -->
<div id="sanatciAlan">
  <button onclick="geriSanatci()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara..." oninput="aramaFiltre()">
  <ul id="liste"></ul>
</div>

<!-- ŞARKI -->
<div id="sarkiAlan">
  <button onclick="geriSarki()">⬅ Geri</button>
  <ul id="sarkiListe"></ul>
</div>

<!-- SÖZ -->
<div id="sozAlani">
  <button onclick="geriSoz()">⬅ Geri</button>
  <div id="sozListe"></div>
</div>

<script>
let mevcutSanatcilar = [];
let mevcutData = [];
let secilenSanatci = null;

async function kategoriSec(kategori){
  document.querySelector('.kategoriler').style.display='none';
  document.getElementById('sanatciAlan').style.display='block';
  document.getElementById('arama').value='';
  const liste=document.getElementById('liste');
  liste.innerHTML='';
  mevcutSanatcilar=[];
  mevcutData=[];
  secilenSanatci=null;

  try{
    const response=await fetch(`data/${kategori}.json`);
    if(!response.ok) throw new Error(response.status);
    const data=await response.json();

    mevcutData=data.sanatcilar||[];
    mevcutSanatcilar=mevcutData.map(s=>s.ad);

    if(mevcutSanatcilar.length===0){
      liste.innerHTML='<li>Sanatçı verisi yok.</li>';
    }else{
      mevcutSanatcilar.forEach(s=>{
        const li=document.createElement('li');
        li.textContent=s;
        li.onclick=()=>sanatciSec(s);
        liste.appendChild(li);
      });
    }
  }catch(e){
    liste.innerHTML='<li>Veri yüklenemedi.</li>';
  }
}

function sanatciSec(ad){
  secilenSanatci=mevcutData.find(s=>s.ad===ad);
  if(!secilenSanatci) return;
  document.getElementById('sanatciAlan').style.display='none';
  document.getElementById('sarkiAlan').style.display='block';
  const sarkiListe=document.getElementById('sarkiListe');
  sarkiListe.innerHTML='';

  (secilenSanatci.sarkilar||[]).forEach(s=>{
    const li=document.createElement('li');
    li.textContent=s.ad;
    li.onclick=()=>sarkiSec(s);
    sarkiListe.appendChild(li);
  });
}

function sarkiSec(s){
  document.getElementById('sarkiAlan').style.display='none';
  document.getElementById('sozAlani').style.display='block';
  document.getElementById('sozListe').textContent=s.soz||'Şarkı sözü yok.';
}

function geriSanatci(){
  document.getElementById('sanatciAlan').style.display='none';
  document.querySelector('.kategoriler').style.display='flex';
}
function geriSarki(){
  document.getElementById('sarkiAlan').style.display='none';
  document.getElementById('sanatciAlan').style.display='block';
}
function geriSoz(){
  document.getElementById('sozAlani').style.display='none';
  document.getElementById('sarkiAlan').style.display='block';
}

function aramaFiltre(){
  const arama=document.getElementById('arama').value.toLowerCase();
  const liste=document.getElementById('liste');
  liste.innerHTML='';
  mevcutSanatcilar
    .filter(s=>s.toLowerCase().includes(arama))
    .forEach(s=>{
      const li=document.createElement('li');
      li.textContent=s;
      li.onclick=()=>sanatciSec(s);
      liste.appendChild(li);
    });
}
</script>

</body>
</html>
