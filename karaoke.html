<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Hatırlatıcı – Kategoriler</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.back-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.25);
  color:#fff;
  cursor:pointer;
  margin-bottom:14px;
}

h2{
  text-align:center;
  margin:10px 0 15px;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>
<div class="container">

<button class="back-btn" onclick="goBack()">← Geri</button>

<h2 id="title">Karaoke Kategorileri</h2>

<div id="list" class="list"></div>

</div>

<script>
// Kategori listesi
const categories = [
  {name:"Pop Müzik"},
  {name:"THM/Özgün"},
  {name:"TSM"},
  {name:"Arabesk"},
  {name:"Türkçe Rock"},
  {name:"Rap"},
  {name:"Türk Müzik Grupları"},
  {name:"Yabancı"}
];

// Pop şarkıcı ve şarkı verisi
const popData = {
  "Işıl German":["Aldırma Gönül","Yorgun Yıllarım"],
  "Işın Karaca":["Yetinmeyi Bilir misin","Benimle Kal","Sevenler Ayrılmaz"],
  "İdo Tatlıses":["Bileklerime Kadar Acıyo","Sen","Bir Hayat"],
  "İlhan Şeşen":["Ellerimde Çiçekler","Sarılınca Sana","Neler Oluyor Bize"],
  "İlyas Yalçıntaş":["İncir","Gel Be Gökyüzüm","Farzet"],
  "İntizar":["Dertliyim Kederliyim","Sensiz Olamam"],
  "İrem Derici":["Kalbimin Tek Sahibine","Zorun Ne Sevgilim","Dantel","Evlenmene Bak"],
  "İzel":["Eller Günahkar","Ah Yandım","Çelik Çomak"],
  "Jehan Barbur":["Sarı","Gidersen","Eskiden"],
  "Kayahan":["Gönül Sayfam","Yemin Ettim","Kar Taneleri"],
  "Kenan Doğulu":["Çakkıdı","Aşk Kokusu","Tutamıyorum Zamanı","Şans Meleğim","Kandırdım"],
  "Keremcem":["Eylül","Ateş","Hayat Bazen Tatlıdır"],
  "Kerim Tekin":["Kar Beyaz","Yine Sensiz","Delalım"],
  "Koray Avcı":["Sen","Aşk Sana Benzer","Adaletin Bu Mu Dünya"],
  "Kutsi":["Sanma Ki","Kalbimdeki Deniz","Üçüncü Hal"],
  "Leman Sam":["Rüzgar","Gül","İlla"],
  "Levent Yüksel":["Zalim","Medcezir","Tuana","Dedikodu"],
  "Mabel Matiz":["Antidepresan","Öyle Kolaysa","Sarmaşık","Gel","Fırtınadayım"],
  "Mansur Ark":["Maalesef","Seni Seviyorum","Hadi Git"],
  "Manuş Baba":["Eteği Belinde","Dönersen Islık Çal","Bu Havada Gidilmez"],
  "Mazhar Alanson":["Yandım","Ele Güne Karşı","Ah Bu Ben"],
  "Mehmet Erdem":["Hakim Bey","Herkes Aynı Hayatta","Acıyı Sevmek Olur Mu"],
  "Melike Demirağ":["Arkadaş","Uğurlar Olsun"],
  "Merve Özbey":["Yaş Hikayesi","Vuracak","Bir İmkansız Var"],
  "Metin Arolat":["Dert Değil","Yine Bir Başıma"],
  "Mirkelam":["Her Gece","Asuman Pansuman","Tavla"],
  "Murat Boz":["Janti","Özledim","Geri Dönüş Olsa","Can Kenarım","Uçurum"],
  "Murat Dalkılıç":["La Fontaine","Bu Nasıl Aşk","Kırk Yılda Bir Gibisin"],
  "Mustafa Ceceli":["Limon Çiçekleri","Es","Hüsran","Sultanım"],
  "Mustafa Sandal":["Araba","Jest Oldu","Aya Benzer","İsyankar","Beni Ağlatma"]
};

// ================== UYGULAMA ==================
let view = "categories"; // categories, artists, songs
let currentCategory = "";
let currentArtist = "";

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");

function renderCategories(){
  view = "categories";
  titleEl.innerText = "Karaoke Kategorileri";
  listEl.innerHTML = "";
  categories.forEach(cat=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = cat.name;
    div.onclick = ()=>showArtists(cat.name);
    listEl.appendChild(div);
  });
}

function showArtists(category){
  view = "artists";
  currentCategory = category;
  titleEl.innerText = category;
  listEl.innerHTML = "";

  let artists = [];
  if(category === "Pop Müzik"){
    artists = Object.keys(popData).sort((a,b)=>a.localeCompare(b,"tr"));
  }
  // Diğer kategoriler için artists dizisi buraya eklenecek

  artists.forEach(artist=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = artist;
    div.onclick = ()=>showSongs(artist, category);
    listEl.appendChild(div);
  });
}

function showSongs(artist, category){
  view = "songs";
  currentArtist = artist;
  titleEl.innerText = artist + " – Şarkılar";
  listEl.innerHTML = "";

  let dataSet = {};
  if(category === "Pop Müzik") dataSet = popData;
  // Diğer kategoriler için dataSet buraya eklenecek

  dataSet[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    showArtists(currentCategory);
  } else if(view === "artists"){
    renderCategories();
  } else {
    window.location.href = 'index.html';
  }
}

// Başlangıçta kategorileri göster
renderCategories();
</script>

</body>
</html>
