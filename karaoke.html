<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* ÜST BAR */
.header {
  display: flex;
  align-items: center;
  padding: 15px;
}

.back-btn {
  background: none;
  border: none;
  color: #f2f2f2;
  font-size: 16px;
  cursor: pointer;
}

/* KONTENT */
.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

/* ARAMA */
.search {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

/* LİSTE */
.list {
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow-y: auto;
  max-height: 65vh;
}

.item {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.item:last-child {
  border-bottom: none;
}
</style>
</head>

<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">← Geri</button>
</div>

<div class="container">
  <h2>Türk Pop Sanatçıları</h2>

    type="text"

/* LİSTEYİ BAS */
function render(list) {
  const el = document.getElementById("artistList");
  el.innerHTML = "";
  list.forEach(name => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = name;
    el.appendChild(div);
  });
}

/* FİLTRE */
function filterArtists(val) {
  const v = val.toLowerCase();
  render(artists.filter(a => a.toLowerCase().startsWith(v)));
}

/* SAYFA AÇILINCA TAM LİSTE */
