<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Karaoke Hatırlatıcı</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.btn{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  font-size:16px;
  border-radius:14px;
  border:none;
  background:#c62828;
  color:#fff;
  cursor:pointer;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div class="container">

<a href="index.html" class="btn">← Ana Sayfaya Dön</a>

</html>
