<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke</title>

<style>
:root{
  --lila:#a78bff;
  --lila-dark:#7f63e6;
  --bg:#0e0e0e;
  --card:#1a1a1a;
  --white:#ffffff;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:#fff;
}

/* ===== KATEGORİLER ===== */
.kategoriler{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding:24px;
  max-width:300px;
  margin:60px auto 20px auto;
}

/* ANA SAYFA */
#anaSayfaBtn{
  background:#fff;
  color:#111;
  border:none;
  border-radius:22px;
  font-size:12px;
  font-weight:600;
  padding:6px 16px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
#anaSayfaBtn:active{
  transform:scale(.95);
}

/* KATEGORİ BUTONLARI */
.kategoriBtn{
  width:100%;
  padding:10px 14px;
  border-radius:22px;
  background:linear-gradient(145deg,var(--lila),var(--lila-dark));
  color:#fff;
  font-size:14px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  box-shadow:
    0 8px 18px rgba(0,0,0,.55),
    0 0 0 rgba(167,139,255,0);
  transition:transform .18s ease, box-shadow .18s ease;
}

.kategoriBtn:hover{
  box-shadow:
    0 10px 22px rgba(0,0,0,.6),
    0 0 22px rgba(167,139,255,.6);
}

.kategoriBtn:active{
  transform:scale(.96);
}

/* ===== ORTA ALANLAR ===== */
#sanatciAlan,
#sarkiAlan,
#sozAlani{
  display:none;
  max-width:320px;
  margin:30px auto;
}

/* GERİ BUTONU */
#sanatciAlan button,
#sarkiAlan button,
#sozAlani button{
  display:block;
  margin:0 auto 14px auto;
  background:#222;
  color:#fff;
  border:none;
  border-radius:30px;
  padding:6px 16px;
  font-size:12px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
#sanatciAlan button:active,
#sarkiAlan button:active,
#sozAlani button:active{
  transform:scale(.95);
}

/* ARAMA */
#arama{
  width:92%;                 /* ← BURASI GENİŞLİĞİ KISALTIR */
  height:48px;
  border-radius:18px;
  border:none;
  padding:0 14px;
  font-size:14px;
  margin:0 auto 12px auto;   /* ← ORTALAR */
  outline:none;

  background:var(--card);
  color:#fff;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
}

#arama:focus{
  box-shadow:
    0 6px 14px rgba(0,0,0,.6),
    0 0 16px rgba(167,139,255,.35);
}


#arama:focus{
  box-shadow:
    0 6px 14px rgba(0,0,0,.6),
    0 0 16px rgba(167,139,255,.35);
}



/* LİSTELER */
ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{
  background:var(--card);
  padding:12px;
  margin-bottom:8px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.45);
  transition:transform .15s ease, box-shadow .15s ease;
}

li:hover{
  box-shadow:
    0 6px 14px rgba(0,0,0,.6),
    0 0 16px rgba(167,139,255,.35);
}

li:active{
  transform:scale(.97);
}

/* ŞARKI SÖZÜ */
#sozListe{
  background:#202020;
  border-radius:18px;
  padding:16px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="kategoriler">
  <button id="anaSayfaBtn" onclick="window.location.href='index.html'">Ana Sayfa</button>

  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabanci')">Yabancı</div>
</div>

<div id="sanatciAlan">
  <button onclick="geriSanatci()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara..." oninput="aramaFiltre()">
  <ul id="liste"></ul>
</div>

<div id="sarkiAlan">
  <button onclick="geriSarki()">⬅ Geri</button>
  <ul id="sarkiListe"></ul>
</div>

<div id="sozAlani">
  <button onclick="geriSoz()">⬅ Geri</button>
  <div id="sozListe"></div>
</div>

<script>
let mevcutSanatcilar=[], mevcutData=[], secilenSanatci=null;

async function kategoriSec(k){
  document.querySelector('.kategoriler').style.display='none';
  sanatciAlan.style.display='block';
  arama.value='';
  liste.innerHTML='';
  mevcutSanatcilar=[];
  mevcutData=[];

  try{
    const r=await fetch(`data/${k}.json`);
    const d=await r.json();
    mevcutData=d.sanatcilar||[];
    mevcutSanatcilar=mevcutData.map(s=>s.ad);
    mevcutSanatcilar.forEach(s=>{
      const li=document.createElement('li');
      li.textContent=s;
      li.onclick=()=>sanatciSec(s);
      liste.appendChild(li);
    });
  }catch{
    liste.innerHTML='<li>Veri yüklenemedi</li>';
  }
}

function sanatciSec(a){
  secilenSanatci=mevcutData.find(s=>s.ad===a);
  sanatciAlan.style.display='none';
  sarkiAlan.style.display='block';
  sarkiListe.innerHTML='';
  (secilenSanatci.sarkilar||[]).forEach(s=>{
    const li=document.createElement('li');
    li.textContent=s.ad;
    li.onclick=()=>sarkiSec(s);
    sarkiListe.appendChild(li);
  });
}

function sarkiSec(s){
  sarkiAlan.style.display='none';
  sozAlani.style.display='block';
  sozListe.textContent=s.soz||'Şarkı sözü yok.';
}

function geriSanatci(){
  sanatciAlan.style.display='none';
  document.querySelector('.kategoriler').style.display='flex';
}
function geriSarki(){
  sarkiAlan.style.display='none';
  sanatciAlan.style.display='block';
}
function geriSoz(){
  sozAlani.style.display='none';
  sarkiAlan.style.display='block';
}

function aramaFiltre(){
  const q=arama.value.toLowerCase();
  liste.innerHTML='';
  mevcutSanatcilar.filter(s=>s.toLowerCase().includes(q)).forEach(s=>{
    const li=document.createElement('li');
    li.textContent=s;
    li.onclick=()=>sanatciSec(s);
    liste.appendChild(li);
  });
}
</script>

</body>
</html>
