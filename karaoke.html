<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fonem Karaoke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .kategoriler button {
      background: darkred;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }

    .kategoriler button:hover {
      background: red;
    }

    #geriBtn {
      display: none;
      margin: 15px;
      padding: 8px 16px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 500px;
      margin: 0 auto;
    }

    li {
      padding: 12px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    li:hover {
      background: #222;
    }
  </style>
</head>
<body>

<header>🎤 Fonem Karaoke</header>

<div class="kategoriler">
  <button onclick="kategoriYukle('pop')">Pop</button>
  <button onclick="kategoriYukle('rock')">Rock</button>
  <button onclick="kategoriYukle('arabesk')">Arabesk</button>
  <button onclick="kategoriYukle('sanat')">Sanat Müziği</button>
  <button onclick="kategoriYukle('halk_ozgun')">Halk / Özgün</button>
  <button onclick="kategoriYukle('grup')">Gruplar</button>
  <button onclick="kategoriYukle('yabancı')">Yabancı</button>
</div>

<button id="geriBtn" onclick="geri()">⬅ Geri</button>

<ul id="liste"></ul>

<script src="app.js"></script>
</body>
</html>
