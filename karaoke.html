<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Karaoke</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* ÖNCEKİ SAYFAYA DÖN */
    #oncekiSayfaBtn {
      display: block;
      margin: 15px auto;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
    }

    #oncekiSayfaBtn:hover {
      background: #333;
    }

    /* LİSTE */
    ul {
      list-style: none;
      padding: 10px 20px 20px;
      margin: 0;
    }

    li {
      padding: 12px;
      margin-bottom: 8px;
      background: #1c1c1c;
      border-radius: 6px;
      cursor: pointer;
    }

    li:hover {
      background: #2a2a2a;
    }

    /* ŞARKI → SANATÇI GERİ */
    #geriBtn {
      display: none;
      margin: 10px 20px;
      padding: 8px 14px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ŞARKI SÖZÜ */
    #sozAlani {
      display: none;
      padding: 20px;
      margin: 20px;
      background: #000;
      border-radius: 8px;
    }

    #sozAlani h3 {
      margin-top: 0;
      text-align: center;
    }

    pre {
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- ÖNCEKİ SAYFAYA DÖN -->
  <button id="oncekiSayfaBtn" onclick="history.back()">
    ⬅ Önceki Sayfaya Dön
  </button>

  <!-- ŞARKI → SANATÇI GERİ -->
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>

  <!-- LİSTELER -->
  <ul id="liste"></ul>
