// ================== UYGULAMA ==================
let view = "artists";
let artists = Object.keys(data).sort((a,b)=>a.localeCompare(b,"tr"));

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const searchEl = document.getElementById("search");

function renderArtists(list){
  listEl.innerHTML = "";
  list.forEach(name=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = name;
    div.onclick = ()=>showSongs(name);
    listEl.appendChild(div);
  });
}

function filterArtists(val){
  val = val.toLowerCase();
  renderArtists(
    artists.filter(a=>a.toLowerCase().startsWith(val))
  );
}

function showSongs(artist){
  view = "songs";
  titleEl.innerText = artist + " – Şarkılar";
  searchEl.style.display = "none";
  listEl.innerHTML = "";

  data[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    view = "artists";
    titleEl.innerText = "Türk Pop – Sanatçılar";
    searchEl.style.display = "block";
    searchEl.value = "";
    renderArtists(artists);
  }else{
    history.back();
  }
}

renderArtists(artists);
