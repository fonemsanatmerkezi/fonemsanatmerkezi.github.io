<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fonem Karaoke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    .kategoriler {
      padding: 15px;
    }

    .kategoriler button {
      margin: 5px;
      padding: 10px 18px;
      font-size: 15px;
      background: darkred;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .kategoriler button:hover {
      background: red;
    }

    #geriBtn {
      display: none;
      margin: 10px auto;
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #liste {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 500px;
    }

    #liste li {
      padding: 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    #liste li:hover {
      background: #111;
    }

    #sozAlani {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #111;
      border-radius: 10px;
      text-align: left;
      white-space: pre-line;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>🎤 Fonem Karaoke</header>

  <div class="kategoriler">
    <button onclick="kategoriYukle('pop')">Pop</button>
    <button onclick="kategoriYukle('rock')">Rock</button>
    <button onclick="kategoriYukle('arabesk')">Arabesk</button>
    <button onclick="kategoriYukle('sanat')">Sanat Müziği</button>
    <button onclick="kategoriYukle('halk_ozgun')">Halk / Özgün</button>
    <button onclick="kategoriYukle('grup')">Gruplar</button>
    <button onclick="kategoriYukle('yabancı')">Yabancı</button>
  </div>

  <button id="geriBtn" onclick="geri()">⬅ Geri</button>

  <ul id="liste"></ul>

  <div id="sozAlani"></div>

  <!-- JavaScript -->
  <script src="app.js"></script>

</body>
</html>
