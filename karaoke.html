<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* KATEGORİ BUTONLARI & ANA SAYFA BUTONU */
.kategoriler{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:20px;
  max-width:300px;
  margin:60px auto 20px auto;
}

.kategoriBtn{
  background:#c62828; /* kırmızı */
  color:#fff;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  width:100%;
  text-align:center;
  cursor:pointer;
  user-select:none;
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  transition:transform .1s ease, background-color .1s ease, box-shadow .1s ease;
}

.kategoriBtn:active{
  background:#a91f1f;
  transform:scale(.95);
  box-shadow:0 2px 4px rgba(0,0,0,.45);
}

/* ANA SAYFA BUTONU */
#anaSayfaBtn{
  background:#0288d1; /* mavi */
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  width:100%;
  text-align:center;
  cursor:pointer;
  user-select:none;
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  transition:transform .1s ease, background-color .1s ease, box-shadow .1s ease;
}

#anaSayfaBtn:active{
  background:#0277bd;
  transform:scale(.95);
  box-shadow:0 2px 4px rgba(0,0,0,.45);
}

/* SANATÇI LİSTESİ ALANI */
#sanatciAlan{
  display:none;
  max-width:400px;
  margin:20px auto;
}

#sanatciAlan #geriBtn{
  width:100%;
  height:36px;
  background:#c62828;
  border:none;
  border-radius:14px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  margin-bottom:10px;
}

#sanatciAlan #geriBtn:active{
  background:#a91f1f;
}

#sanatciAlan #arama{
  width:100%;
  height:36px;
  border-radius:14px;
  border:none;
  padding:0 12px;
  font-size:14px;
  margin-bottom:10px;
  display:block;
}

#sanatciAlan ul{
  list-style:none;
  padding:0;
  margin:0;
}

#sanatciAlan li{
  background:#1c1c1c;
  padding:10px;
  margin-bottom:6px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- KATEGORİLER ve ANA SAYFA -->
<div class="kategoriler">
  <button id="anaSayfaBtn" onclick="window.location.href='index.html'">Ana Sayfa</button>
  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabanci')">Yabancı</div>
</div>

<!-- SANATÇI LİSTESİ -->
<div id="sanatciAlan">
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara..." oninput="aramaFiltre()">
  <ul id="liste"></ul>
</div>

<script>
let mevcutSanatcilar = [];
let mevcutData = []; // JSON objesi, şarkılar için

async function kategoriSec(kategori){
  document.querySelector('.kategoriler').style.display = 'none';
  document.getElementById('sanatciAlan').style.display = 'block';
  document.getElementById('arama').value = '';
  mevcutSanatcilar = [];
  mevcutData = [];

  const liste = document.getElementById('liste');
  liste.innerHTML = '';

  try {
    const response = await fetch(`data/${kategori}.json`);
    if(!response.ok) throw new Error(`Dosya bulunamadı: ${response.status}`);
    const data = await response.json();

    if(!data.sanatcilar || !Array.isArray(data.sanatcilar)) 
      throw new Error('JSON içinde sanatcilar array bulunamadı');

    mevcutData = data.sanatcilar;
    mevcutSanatcilar = data.sanatcilar.map(s => s.ad);

    if(mevcutSanatcilar.length === 0){
      liste.innerHTML = '<li>Sanatçı verisi henüz yok.</li>';
    } else {
      mevcutSanatcilar.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        li.onclick = () => alert(s + ' seçildi'); // ileride şarkı listesi açılabilir
        liste.appendChild(li);
      });
    }

  } catch(err){
    console.error(err);
    liste.innerHTML = `<li>Sanatçı verisi yüklenemedi: ${err.message}</li>`;
  }
}

function geri(){
  document.querySelector('.kategoriler').style.display = 'flex';
  document.getElementById('sanatciAlan').style.display = 'none';
  document.getElementById('liste').innerHTML = '';
  mevcutSanatcilar = [];
  mevcutData = [];
}

function aramaFiltre(){
  const arama = document.getElementById('arama').value.toLowerCase();
  const liste = document.getElementById('liste');
  liste.innerHTML = '';
  mevcutSanatcilar
    .filter(s => s.toLowerCase().includes(arama))
    .forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      li.onclick = () => alert(s + ' seçildi');
      liste.appendChild(li);
    });
}
</script>

</body>
</html>
