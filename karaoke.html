<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Karaoke</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* KATEGORİLERE DÖN */
    #kategoriDon {
      display: block;
      margin: 15px auto;
      text-align: center;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    ul {
      list-style: none;
      padding: 20px;
      margin: 0;
    }

    li {
      padding: 12px;
      margin-bottom: 8px;
      background: #1c1c1c;
      border-radius: 6px;
      cursor: pointer;
    }

    li:hover {
      background: #2a2a2a;
    }

    #geriBtn {
      display: none;
      margin: 10px 20px;
      padding: 8px 14px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #sozAlani {
      display: none;
      padding: 20px;
      margin: 20px;
      background: #000;
      border-radius: 8px;
    }

    pre {
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- KATEGORİLERE GERİ -->
  <a id="kategoriDon" href="index.html">← Kategorilere Dön</a>

  <!-- ŞARKI → SANATÇI GERİ -->
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>

  <ul id="liste"></ul>

  <div id="sozAlani"></div>

  <script src="app.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const kategori = params.get("kategori") || "pop";
    kategoriYukle(kategori);
  </script>

</body>
</html>
