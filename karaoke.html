<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Karaoke</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

header{
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

#geriBtn{
  display:none;
  padding:8px 14px;
  background:#c62828;
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}

#arama{
  flex:1;
  display:none;
  padding:8px;
  border-radius:8px;
  border:none;
}

.kategoriler{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:20px;
}

.kategoriBtn{
  padding:14px;
  background:#fff;
  color:#000;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
}

ul{
  list-style:none;
  padding:20px;
  margin:0;
}

li{
  background:#1c1c1c;
  padding:12px;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
}

#sozAlani{
  display:none;
  padding:20px;
  background:#000;
}
</style>
</head>

<body>

<header>
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara...">
</header>

<div id="kategoriAlan" class="kategoriler">
  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabancı')">Yabancı</div>
</div>

<ul id="liste"></ul>
<div id="sozAlani"></div>

<script src="app.js"></script>
</body>
</html>
