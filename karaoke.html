<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Hatırlatıcı – Türk Pop</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #f2f2f2;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

/* GERI BUTONU */
.back-btn {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 1000;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  font-size: 16px;
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
}

.back-btn:hover {
  background: rgba(255,255,255,0.25);
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 70px 16px 16px;
  text-align: center;
}

h2 {
  margin: 10px 0;
}

.search {
  width: 100%;
  padding: 14px;
  margin: 14px 0;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

.list {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  overflow-y: auto;
  max-height: 65vh;
}

.item {
  padding: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  cursor: pointer;
  text-align: left;
}

.item:hover {
  background: rgba(255,255,255,0.12);
}

.item:last-child {
  border-bottom: none;
}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Geri</button>

<div class="container">
  <h2 id="title">Türk Pop – Sanatçılar (A)</h2>

  <input
    type="text"
    id="searchBox"
    class="search"
    placeholder="Harf veya isim yaz..."
    onkeyup="filterArtists(this.value)"
  >

  <div class="list" id="list"></div>
</div>

<script>
/* === A HARFİ VERİSİ (DEVAM EDECEK) === */
const data = {
  "Ajda Pekkan": [
    "Yaz Yaz Yaz",
    "Sana Neler Edeceğim",
    "Hoşgör Sen",
    "Bambaşka Biri",
    "Yakar Geçerim",
    "Aynen Öyle",
    "O Benim Dünyam",
    "Uykusuz Her Gece",
    "Haykıracak Nefesim Yok",
    "Arada Sırada"
  ],
  "Ajdar": [
    "Çikita Muz",
    "Şahdamar",
    "Ringa Ringa",
    "Pizza",
    "Çikita Muz (Remix)"
  ],
  "Ajlan Büyükburç": [
    "Yaz Yaz Yaz",
    "Ayrılık Zor",
    "Olmaz Böyle Şey"
  ],
  "Akın": [
    "Kaybolan Yıllar",
    "Anladım Ki",
    "Sen Gidince"
  ],
  "Akrep Nalan": [
    "Dağ Çiçeği",
    "Hani",
    "Bir Şarkısın Sen"
  ],
  "Aleyna Tilki": [
    "Cevapsız Çınlama",
    "Sen Olsan Bari",
    "Yalan",
    "Nasılsın Aşkta"
  ],
  "Ali Güven": [
    "Yolcu",
    "Dön Desem",
    "Unutamam"
  ],
  "Ali Kocatepe": [
    "Sevdan Olmasaydı",
    "Geriye Dönsen",
    "Bir Gün Beni Ararsan"
  ],
  "Ali Rıza Binboğa": [
    "Yarınlar Bizim",
    "Savaştan Barışa"
  ],
  "Alişan": [
    "Var Ya",
    "Hele Bi",
    "Sana Bir Şey Olmasın"
  ]
};

const artists = Object.keys(data).sort((a,b)=>a.localeCompare(b,'tr'));
let view = "artists";

function renderArtists(list) {
  const el = document.getElementById("list");
  el.innerHTML = "";
  list.forEach(name => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = name;
    div.onclick = () => showSongs(name);
    el.appendChild(div);
  });
}

function filterArtists(val) {
  const v = val.toLowerCase();
  renderArtists(artists.filter(a => a.toLowerCase().startsWith(v)));
}

function showSongs(artist) {
  view = "songs";
  document.getElementById("title").textContent = artist + " – Şarkılar";
  document.getElementById("searchBox").style.display = "none";

  const el = document.getElementById("list");
  el.innerHTML = "";

  data[artist].forEach(song => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = song;
    el.appendChild(div);
  });
}

function goBack() {
  if (view === "songs") {
    view = "artists";
    document.getElementById("title").textContent = "Türk Pop – Sanatçılar (A)";
    document.getElementById("searchBox").style.display = "block";
    document.getElementById("searchBox").value = "";
    renderArtists(artists);
  } else {
    history.back();
  }
}

renderArtists(artists);
</script>

</body>
</html>
