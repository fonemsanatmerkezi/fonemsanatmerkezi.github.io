<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Sanatçı Hatırlatıcı</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.back-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.25);
  color:#fff;
  cursor:pointer;
  margin-bottom:14px;
}

h2{
  text-align:center;
  margin:10px 0 15px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:16px;
  margin-bottom:12px;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>
<div class="container">

<button class="back-btn" onclick="goBack()">← Geri</button>

<h2 id="title">Karaoke – Kategoriler</h2>

<input
  id="search"
  class="search"
  placeholder="Harf veya sanatçı yaz..."
  onkeyup="filterArtists(this.value)"
  style="display:none;"
>

<div id="list" class="list"></div>

</div>

<script>
// ================== VERİ ==================

// Pop Müzik sanatçı ve şarkı listesi (daha önce hazırlandı)

  "Ajdar":["Çikita Muz","Şahdamar"],

  "Aslı Güngör":["Kalp Kalbe Karşı","Ayrılık"],
  "Aşkın Nur Yengi":["Yabani","Hesap Ver"],

  "Ayşegül Aldinç":["Söze Ne Hacet","O Kız"],

  "Bengü":["Sanki","Saygımdan","Korkma Kalbim"],
  "Berkay":["Ele İnat","İki Hece"],
  "Bilal Sonses":["İki Kelime","Hasbelkader"],

  "Buray":["İstersen","Sen Sevda Mısın"],
  "Candan Erçetin":["Elbette","Yalan","Annem"],
  "Çelik":["Hercai","Ateşteyim"],
  "Demet Akalın":["Afedersin","Kulüp","Ateş"],
  "Deniz Seki":["Masal","Hayat İki Bilet"],
  "Derya Uluğ":["Okyanus","Canavar"],
  "Ece Seçkin":["Adeyyo","Dibine Dibine","Olsun"],
  "Edis":["Benim Ol","Martılar","Yalan"],
  "Emel Müftüoğlu":["Hovarda","Tutamıyorum Zamanı"],

  "Ferhat Göçer":["Cennet","Üzüm"],
  "Fettah Can":["Delirme","Mandıra Filozofu"],
  "Göksel":["Depresyondayım","Bi Seni Konuşurum"],
  "Gülşen":["Bangır Bangır","Of Of"],
  "Hadise":["Düm Tek Tek","Prenses"],
  "Hande Yener":["Kırmızı","Romeo","Mor","Bodrum"],
  "Işıl German":["Aldırma Gönül","Yorgun Yıllarım"],
  "Işın Karaca":["Yetinmeyi Bilir misin","Benimle Kal","Sevenler Ayrılmaz"],
  "İdo Tatlıses":["Bileklerime Kadar Acıyo","Sen","Bir Hayat"],
  "İlhan Şeşen":["Ellerimde Çiçekler","Sarılınca Sana","Neler Oluyor Bize"],
  "İlyas Yalçıntaş":["İncir","Gel Be Gökyüzüm","Farzet"],
  "İntizar":["Dertliyim Kederliyim","Sensiz Olamam"],
  "İrem Derici":["Kalbimin Tek Sahibine","Zorun Ne Sevgilim","Dantel","Evlenmene Bak"],
  "İzel":["Eller Günahkar","Ah Yandım","Çelik Çomak"],
  "Jehan Barbur":["Sarı","Gidersen","Eskiden"],
  "Kayahan":["Gönül Sayfam","Yemin Ettim","Kar Taneleri"],
  "Kenan Doğulu":["Çakkıdı","Aşk Kokusu","Tutamıyorum Zamanı","Şans Meleğim","Kandırdım"],
  "Keremcem":["Eylül","Ateş","Hayat Bazen Tatlıdır"],
  "Kerim Tekin":["Kar Beyaz","Yine Sensiz","Delalım"],
  "Koray Avcı":["Sen","Aşk Sana Benzer","Adaletin Bu Mu Dünya"],
  "Kutsi":["Sanma Ki","Kalbimdeki Deniz","Üçüncü Hal"],
  "Leman Sam":["Rüzgar","Gül","İlla"],
  "Levent Yüksel":["Zalim","Medcezir","Tuana","Dedikodu"],
  "Mabel Matiz":["Antidepresan","Öyle Kolaysa","Sarmaşık","Gel","Fırtınadayım"],
  "Mansur Ark":["Maalesef","Seni Seviyorum","Hadi Git"],
  "Manuş Baba":["Eteği Belinde","Dönersen Islık Çal","Bu Havada Gidilmez"],
  "Mazhar Alanson":["Yandım","Ele Güne Karşı","Ah Bu Ben"],
  "Mehmet Erdem":["Hakim Bey","Herkes Aynı Hayatta","Acıyı Sevmek Olur Mu"],
  "Melike Demirağ":["Arkadaş","Uğurlar Olsun"],
  "Merve Özbey":["Yaş Hikayesi","Vuracak","Bir İmkansız Var"],
  "Metin Arolat":["Dert Değil","Yine Bir Başıma"],
  "Mirkelam":["Her Gece","Asuman Pansuman","Tavla"],
  "Murat Boz":["Janti","Özledim","Geri Dönüş Olsa","Can Kenarım","Uçurum"],
  "Murat Dalkılıç":["La Fontaine","Bu Nasıl Aşk","Kırk Yılda Bir Gibisin"],
  "Murat Evgin":["Gitti","Aşkıma Tutuldum"],
  "Mustafa Ceceli":["Limon Çiçekleri","Es","Hüsran","Sultanım"],
  "Mustafa Sandal":["Araba","Jest Oldu","Aya Benzer","İsyankar","Beni Ağlatma"]
};

// Diğer kategoriler için boş placeholder veri
const thmData = {};
const tsmData = {};
const arabeskData = {};
const turkRockData = {};
const rapData = {};
const turkGruplariData = {};
const yabanciData = {};

// Kategoriler
const categories = [
  {name:"Pop Müzik", data:popData},
  {name:"THM / Özgün", data:thmData},
  {name:"TSM", data:tsmData},
  {name:"Arabesk", data:arabeskData},
  {name:"Türkçe Rock", data:turkRockData},
  {name:"Rap", data:rapData},
  {name:"Türk Müzik Grupları", data:turkGruplariData},
  {name:"Yabancı", data:yabanciData}
];

let view = "categories"; // başlangıçta kategori görünümü
let currentData = null;
let artists = [];

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const searchEl = document.getElementById("search");

// Render fonksiyonları
function renderCategories(){
  listEl.innerHTML = "";
  categories.forEach(cat=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = cat.name;
    div.onclick = ()=>{
      currentData = cat.data;
      artists = Object.keys(currentData).sort((a,b)=>a.localeCompare(b,"tr"));
      view = "artists";
      titleEl.innerText = cat.name + " – Sanatçılar";
      searchEl.style.display = "block";
      searchEl.value = "";
      renderArtists(artists);
    };
    listEl.appendChild(div);
  });
}

function renderArtists(list){
  listEl.innerHTML = "";
  list.forEach(name=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = name;
    div.onclick = ()=>showSongs(name);
    listEl.appendChild(div);
  });
}

function filterArtists(val){
  val = val.toLowerCase();
  renderArtists(
    artists.filter(a=>a.toLowerCase().startsWith(val))
  );
}

function showSongs(artist){
  view = "songs";
  titleEl.innerText = artist + " – Şarkılar";
  searchEl.style.display = "none";
  listEl.innerHTML = "";

  currentData[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    view = "artists";
    titleEl.innerText = getCategoryName() + " – Sanatçılar";
    searchEl.style.display = "block";
    searchEl.value = "";
    renderArtists(artists);
  } else if(view === "artists"){
    view = "categories";
    titleEl.innerText = "Karaoke – Kategoriler";
    searchEl.style.display = "none";
    renderCategories();
  } else {
    history.back();
  }
}

function getCategoryName(){
  for(let cat of categories){
    if(cat.data === currentData) return cat.name;
  }
  return "";
}

// Başlangıçta kategori listesi göster
renderCategories();
</script>

</body>
</html>
