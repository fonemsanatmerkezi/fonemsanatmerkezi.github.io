<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <title>Fonem Karaoke</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="tr">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      text-align: center;
      padding: 15px;
      border-bottom: 1px solid #333;
    }

    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c00000;
    }

    main {
      padding: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 12px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    li:hover {
      background: #111;
    }

    #sozler {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #333;
      background: #050505;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <h1>🎤 Fonem Karaoke</h1>
</header>

<nav>
  <button onclick="loadPop()">Pop</button>
</nav>

<main>
  <div id="liste">
    <p>Bir kategori seçin.</p>
  </div>

  <div id="sozler"></div>
</main>

<script src="js/uygulama.js"></script>

</body>
</html>
