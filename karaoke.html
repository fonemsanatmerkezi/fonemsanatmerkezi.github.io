<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke</title>

<style>
:root{
  --red:#c62828;
  --red-dark:#a91f1f;
  --blue:#0288d1;
  --bg:#0e0e0e;
  --card:#181818;
  --neon:rgba(255,60,60,.45);
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:#fff;
}

/* ===== KATEGORİLER ===== */
.kategoriler{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding:24px;
  max-width:320px;
  margin:60px auto 20px auto;
}

/* PREMIUM BUTON */
.kategoriBtn,
#anaSayfaBtn,
#sanatciAlan button,
#sarkiAlan button,
#sozAlani button{
  background:linear-gradient(145deg,#d32f2f,#b71c1c);
  color:#fff;
  border:none;
  border-radius:16px;
  font-size:14px;
  font-weight:600;
  padding:12px 18px;
  width:100%;
  text-align:center;
  cursor:pointer;
  user-select:none;
  box-shadow:
    0 0 0 0 var(--neon),
    0 6px 16px rgba(0,0,0,.45);
  transition:
    transform .12s ease,
    box-shadow .12s ease,
    filter .12s ease;
}

/* HAFİF LUXURY PULSE */
.kategoriBtn:hover,
#anaSayfaBtn:hover{
  box-shadow:
    0 0 14px 2px var(--neon),
    0 8px 18px rgba(0,0,0,.55);
}

.kategoriBtn:active,
#anaSayfaBtn:active,
#sanatciAlan button:active,
#sarkiAlan button:active,
#sozAlani button:active{
  transform:scale(.96);
  filter:brightness(.95);
}

/* ANA SAYFA BUTONU */
#anaSayfaBtn{
  background:linear-gradient(145deg,#039be5,#0277bd);
  margin-bottom:10px;
}

/* ===== LİSTE ALANLARI ===== */
#sanatciAlan,
#sarkiAlan,
#sozAlani{
  display:none;
  max-width:420px;
  margin:30px auto;
  padding:0 16px;
}

/* ARAMA */
#arama{
  width:100%;
  height:40px;
  border-radius:16px;
  border:none;
  padding:0 14px;
  font-size:14px;
  margin-bottom:12px;
  outline:none;
}

/* LİSTELER */
ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{
  background:var(--card);
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  transition:background .12s ease, transform .12s ease;
}

li:hover{
  background:#222;
}

li:active{
  transform:scale(.97);
}

/* ŞARKI SÖZÜ */
#sozListe{
  padding:16px;
  background:#1f1f1f;
  border-radius:14px;
  line-height:1.6;
}
</style>
</head>

<body>

<!-- KATEGORİLER -->
<div class="kategoriler">
  <button id="anaSayfaBtn" onclick="window.location.href='index.html'">Ana Sayfa</button>

  <div class="kategoriBtn" onclick="kategoriSec('pop')">Pop</div>
  <div class="kategoriBtn" onclick="kategoriSec('arabesk')">Arabesk</div>
  <div class="kategoriBtn" onclick="kategoriSec('rock')">Rock</div>
  <div class="kategoriBtn" onclick="kategoriSec('grup')">Grup</div>
  <div class="kategoriBtn" onclick="kategoriSec('sanat')">Sanat Müziği</div>
  <div class="kategoriBtn" onclick="kategoriSec('halk_ozgun')">Halk / Özgün</div>
  <div class="kategoriBtn" onclick="kategoriSec('yabanci')">Yabancı</div>
</div>

<!-- SANATÇI -->
<div id="sanatciAlan">
  <button onclick="geriSanatci()">⬅ Geri</button>
  <input id="arama" placeholder="Sanatçı ara..." oninput="aramaFiltre()">
  <ul id="liste"></ul>
</div>

<!-- ŞARKI -->
<div id="sarkiAlan">
  <button onclick="geriSarki()">⬅ Geri</button>
  <ul id="sarkiListe"></ul>
</div>

<!-- SÖZ -->
<div id="sozAlani">
  <button onclick="geriSoz()">⬅ Geri</button>
  <div id="sozListe"></div>
</div>

<script>
let mevcutSanatcilar = [];
let mevcutData = [];
let secilenSanatci = null;

async function kategoriSec(kategori){
  document.querySelector('.kategoriler').style.display='none';
  document.getElementById('sanatciAlan').style.display='block';
  document.getElementById('arama').value='';
  const liste=document.getElementById('liste');
  liste.innerHTML='';
  mevcutSanatcilar=[];
  mevcutData=[];
  secilenSanatci=null;

  try{
    const response=await fetch(`data/${kategori}.json`);
    if(!response.ok) throw new Error(response.status);
    const data=await response.json();

    mevcutData=data.sanatcilar||[];
    mevcutSanatcilar=mevcutData.map(s=>s.ad);

    if(mevcutSanatcilar.length===0){
      liste.innerHTML='<li>Sanatçı verisi yok.</li>';
    }else{
      mevcutSanatcilar.forEach(s=>{
        const li=document.createElement('li');
        li.textContent=s;
        li.onclick=()=>sanatciSec(s);
        liste.appendChild(li);
      });
    }
  }catch(e){
    liste.innerHTML='<li>Veri yüklenemedi.</li>';
  }
}

function sanatciSec(ad){
  secilenSanatci=mevcutData.find(s=>s.ad===ad);
  if(!secilenSanatci) return;
  document.getElementById('sanatciAlan').style.display='none';
  document.getElementById('sarkiAlan').style.display='block';
  const sarkiListe=document.getElementById('sarkiListe');
  sarkiListe.innerHTML='';

  (secilenSanatci.sarkilar||[]).forEach(s=>{
    const li=document.createElement('li');
    li.textContent=s.ad;
    li.onclick=()=>sarkiSec(s);
    sarkiListe.appendChild(li);
  });
}

function sarkiSec(s){
  document.getElementById('sarkiAlan').style.display='none';
  document.getElementById('sozAlani').style.display='block';
  document.getElementById('sozListe').textContent=s.soz||'Şarkı sözü yok.';
}

function geriSanatci(){
  document.getElementById('sanatciAlan').style.display='none';
  document.querySelector('.kategoriler').style.display='flex';
}
function geriSarki(){
  document.getElementById('sarkiAlan').style.display='none';
  document.getElementById('sanatciAlan').style.display='block';
}
function geriSoz(){
  document.getElementById('sozAlani').style.display='none';
  document.getElementById('sarkiAlan').style.display='block';
}

function aramaFiltre(){
  const arama=document.getElementById('arama').value.toLowerCase();
  const liste=document.getElementById('liste');
  liste.innerHTML='';
  mevcutSanatcilar
    .filter(s=>s.toLowerCase().includes(arama))
    .forEach(s=>{
      const li=document.createElement('li');
      li.textContent=s;
      li.onclick=()=>sanatciSec(s);
      liste.appendChild(li);
    });
}
</script>

</body>
</html>
