<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Sanatçı Hatırlatıcı – Türk Pop</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.back-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.25);
  color:#fff;
  cursor:pointer;
  margin-bottom:14px;
}

h2{
  text-align:center;
  margin:10px 0 15px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:16px;
  margin-bottom:12px;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>
<div class="container">

<button class="back-btn" onclick="goBack()">← Geri</button>

<h2 id="title">Türk Pop – Sanatçılar</h2>

<input
  id="search"
  class="search"
  placeholder="Harf veya sanatçı yaz..."
  onkeyup="filterArtists(this.value)"
>

<div id="list" class="list"></div>

</div>

<script>
// ================== VERİ ==================
const data = {
  "Ajda Pekkan":[
    "Yaz Yaz Yaz","Sana Neler Edeceğim","Hoşgör Sen",
    "Bambaşka Biri","Yakar Geçerim"
  ],
  "Ajdar":[
    "Çikita Muz","Şahdamar"
  ],
  "Akrep Nalan":[
    "Dağ Çiçeği","Hani"
  ],
  "Aleyna Tilki":[
    "Cevapsız Çınlama","Sen Olsan Bari","Yalan"
  ],
  "Alişan":[
    "Var Ya","Hele Bi"
  ],
  "Aslı Güngör":[
    "Kalp Kalbe Karşı","Ayrılık"
  ],
  "Aşkın Nur Yengi":[
    "Yabani","Hesap Ver"
  ],
  "Atiye":[
    "Muamma","Budur","Salla"
  ],
  "Ayşegül Aldinç":[
    "Söze Ne Hacet","O Kız"
  ],
  "Ayten Alpman":[
    "Memleketim","Ben Böyleyim"
  ],
  "Bengü":[
    "Sanki","Saygımdan","Korkma Kalbim"
  ],
  "Berkay":[
    "Ele İnat","İki Hece"
  ],
  "Bilal Sonses":[
    "İki Kelime","Hasbelkader"
  ],
  "Burak Kut":[
    "Benimle Oynama","Yaşandı Bitti"
  ],
  "Buray":[
    "İstersen","Sen Sevda Mısın"
  ],
  "Candan Erçetin":[
    "Elbette","Yalan","Annem"
  ],
  "Çelik":[
    "Hercai","Ateşteyim"
  ],
  "Demet Akalın":[
    "Afedersin","Kulüp","Ateş"
  ],
  "Deniz Seki":[
    "Masal","Hayat İki Bilet"
  ],
  "Derya Uluğ":[
    "Okyanus","Canavar"
  ],
  "Ece Seçkin":[
    "Adeyyo","Dibine Dibine","Olsun"
  ],
  "Edis":[
    "Benim Ol","Martılar","Yalan"
  ],
  "Emel Müftüoğlu":[
    "Hovarda","Tutamıyorum Zamanı"
  ],
  "Emre Aydın":[
    "Afili Yalnızlık","Belki Bir Gün Özlersin"
  ],
  "Ferhat Göçer":[
    "Cennet","Üzüm"
  ],
  "Fettah Can":[
    "Delirme","Mandıra Filozofu"
  ],
  "Göksel":[
    "Depresyondayım","Bi Seni Konuşurum"
  ],
  "Gülşen":[
    "Bangır Bangır","Of Of"
  ],
  "Hadise":[
    "Düm Tek Tek","Prenses"
  ],
  "Hande Yener":[
    "Kırmızı","Romeo","Mor","Bodrum"
  ]
};

// ================== UYGULAMA ==================
let view = "artists";
let artists = Object.keys(data).sort((a,b)=>a.localeCompare(b,"tr"));

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const searchEl = document.getElementById("search");

function renderArtists(list){
  listEl.innerHTML = "";
  list.forEach(name=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = name;
    div.onclick = ()=>showSongs(name);
    listEl.appendChild(div);
  });
}

function filterArtists(val){
  val = val.toLowerCase();
  renderArtists(
    artists.filter(a=>a.toLowerCase().startsWith(val))
  );
}

function showSongs(artist){
  view = "songs";
  titleEl.innerText = artist + " – Şarkılar";
  searchEl.style.display = "none";
  listEl.innerHTML = "";

  data[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    view = "artists";
    titleEl.innerText = "Türk Pop – Sanatçılar";
    searchEl.style.display = "block";
    searchEl.value = "";
    renderArtists(artists);
  }else{
    history.back();
  }
}

renderArtists(artists);
</script>

</body>
</html>
