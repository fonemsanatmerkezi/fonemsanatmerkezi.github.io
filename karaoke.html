<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fonem Karaoke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .buttons {
      margin: 20px 0;
    }

    button {
      background-color: #8b0000;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:active {
      background-color: #b22222;
    }

    #liste {
      max-width: 600px;
      margin: 20px auto;
      text-align: left;
      padding: 10px;
    }

    #liste ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #liste li {
      padding: 10px;
      border-bottom: 1px solid #333;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎤 Fonem Karaoke</h1>
  </header>

  <div class="buttons">
    <button onclick="loadCategory('pop')">Pop</button>
    <button onclick="loadCategory('rock')">Rock</button>
    <button onclick="loadCategory('turkce')">Türkçe</button>
  </div>

  <h2>Bir kategori seçin.</h2>

  <!-- 🔴 EN KRİTİK YER BURASI -->
  <div id="liste"></div>

  <!-- 🔴 JS DOSYASI EN ALTTA -->
  <script src="app.js"></script>

</body>
</html>
