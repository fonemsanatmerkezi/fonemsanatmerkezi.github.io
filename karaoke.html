<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Hatırlatıcı – Kategoriler</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.back-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.25);
  color:#fff;
  cursor:pointer;
  margin-bottom:14px;
}

h2{
  text-align:center;
  margin:10px 0 15px;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>
<div class="container">

<button class="back-btn" onclick="goBack()">← Geri</button>

<h2 id="title">Karaoke Kategorileri</h2>

<div id="list" class="list"></div>

</div>

<script>

// Kategori listesi
const categories = [
  {name:"Pop Müzik"},
  {name:"THM/Özgün"},
  {name:"TSM"},
  {name:"Arabesk"},
  {name:"Türkçe Rock"},
  {name:"Rap"},
  {name:"Türk Müzik Grupları"},
  {name:"Yabancı"}
];

// ================== UYGULAMA ==================
let view = "categories"; // categories, artists, songs
let currentCategory = "";
let currentArtist = "";

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");

function renderCategories(){
  view = "categories";
  titleEl.innerText = "Karaoke Kategorileri";
  listEl.innerHTML = "";
  categories.forEach(cat=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = cat.name;
    div.onclick = ()=>showArtists(cat.name);
    listEl.appendChild(div);
  });
}

function showArtists(category){
  view = "artists";
  currentCategory = category;
  titleEl.innerText = category;
  listEl.innerHTML = "";

  let artists = [];
  if(category === "Pop Müzik"){
    artists = Object.keys(popData).sort((a,b)=>a.localeCompare(b,"tr"));
  }
  // Diğer kategoriler için artists dizisi buraya eklenecek

  artists.forEach(artist=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = artist;
    div.onclick = ()=>showSongs(artist, category);
    listEl.appendChild(div);
  });
}

function showSongs(artist, category){
  view = "songs";
  currentArtist = artist;
  titleEl.innerText = artist + " – Şarkılar";
  listEl.innerHTML = "";

  let dataSet = {};
  if(category === "Pop Müzik") dataSet = popData;
  // Diğer kategoriler için dataSet buraya eklenecek

  dataSet[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    showArtists(currentCategory);
  } else if(view === "artists"){
    renderCategories();
  } else {
    window.location.href = 'index.html';
  }
}

// Başlangıçta kategorileri göster
renderCategories();
</script>

</body>
</html>
