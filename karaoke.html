<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Karaoke</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* SAYFA GERİ BUTONU (KATEGORİLERE DÖN) */
    #sayfaGeriBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      background: #000;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
    }

    #sayfaGeriBtn:hover {
      background: #222;
    }

    /* LİSTE */
    ul {
      list-style: none;
      padding: 80px 20px 20px;
      margin: 0;
    }

    li {
      padding: 12px;
      margin-bottom: 8px;
      background: #1c1c1c;
      border-radius: 6px;
      cursor: pointer;
    }

    li:hover {
      background: #2a2a2a;
    }

    /* GERİ BUTONU (ŞARKI → SANATÇI) */
    #geriBtn {
      display: none;
      margin: 10px 20px;
      padding: 8px 14px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ŞARKI SÖZÜ ALANI */
    #sozAlani {
      display: none;
      padding: 20px;
      margin: 20px;
      background: #000;
      border-radius: 8px;
    }

    #sozAlani h3 {
      margin-top: 0;
      text-align: center;
    }

    pre {
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- KATEGORİLERE GERİ -->
  <button id="sayfaGeriBtn" onclick="sayfaGeri()">⬅ Kategorilere Dön</button>

  <!-- ŞARKI → SANATÇI GERİ -->
  <button id="geriBtn" onclick="geri()">⬅ Geri</button>

  <!-- LİSTELER -->
  <ul id="liste"></ul>

  <!-- ŞARKI SÖZLERİ -->
  <div id="sozAlani"></div>

  <script src="app.js"></script>
</body>
</html>
