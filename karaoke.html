<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Hatırlatıcı – Türk Pop</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("github-arka-plan.jpeg") center / cover no-repeat fixed;
}

.header {
  padding: 15px;
}

.back-btn {
  background: none;
  border: none;
  color: #f2f2f2;
  font-size: 16px;
  cursor: pointer;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

.search {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

.list {
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow-y: auto;
  max-height: 65vh;
}

.item {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  cursor: pointer;
}

.item:hover {
  background: rgba(255,255,255,0.1);
}

.item:last-child {
  border-bottom: none;
}
</style>
</head>

<body>

<div class="header">
  <button class="back-btn" id="backBtn" onclick="goBack()">← Geri</button>
</div>

<div class="container">
  <h2 id="title">Türk Pop Sanatçıları</h2>

  <input
    type="text"
    id="searchBox"
    class="search"
    placeholder="Harf veya isim yaz..."
    onkeyup="filterArtists(this.value)"
  >

  <div class="list" id="list"></div>
</div>

<script>
/* SANATÇI → ŞARKI HARİTASI */
const data = {
  "Tarkan": [
    "Şımarık",
    "Kuzu Kuzu",
    "Dudu",
    "Şıkıdım",
    "Öp"
  ],
  "Sezen Aksu": [
    "Gülümse",
    "Hadi Bakalım",
    "Firuze",
    "Tükeneceğiz",
    "Küçüğüm"
  ],
  "Ajda Pekkan": [
    "Yaz Yaz Yaz",
    "Sana Neler Edeceğim",
    "Bambaşka Biri",
    "Petrol",
    "Hoşgör Sen"
  ]
};

/* TÜM SANATÇILAR */
const artists = Object.keys(data);

/* DURUM */
let view = "artists";

/* LİSTEYİ ÇİZ */
function render(list) {
  const el = document.getElementById("list");
  el.innerHTML = "";
  list.forEach(name => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = name;
    div.onclick = () => showSongs(name);
    el.appendChild(div);
  });
}

/* ARAMA */
function filterArtists(val) {
  const v = val.toLowerCase();
  render(artists.filter(a => a.toLowerCase().startsWith(v)));
}

/* SANATÇIYA TIKLANDI */
function showSongs(artist) {
  view = "songs";
  document.getElementById("title").textContent = artist + " – Şarkılar";
  document.getElementById("searchBox").style.display = "none";

  const el = document.getElementById("list");
  el.innerHTML = "";

  data[artist].forEach(song => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = song;
    el.appendChild(div);
  });
}

/* GERİ */
function goBack() {
  if (view === "songs") {
    view = "artists";
    document.getElementById("title").textContent = "Türk Pop Sanatçıları";
    document.getElementById("searchBox").style.display = "block";
    document.getElementById("searchBox").value = "";
    render(artists);
  } else {
    history.back();
  }
}

/* İLK YÜKLEME */
render(artists);
</script>

</body>
</html>
