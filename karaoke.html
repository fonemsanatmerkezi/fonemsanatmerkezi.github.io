<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Hatırlatıcı – Kategoriler</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.back-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.25);
  color:#fff;
  cursor:pointer;
  margin-bottom:14px;
}

h2{
  text-align:center;
  margin:10px 0 15px;
}

.list{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  max-height:65vh;
  overflow:auto;
}

.item{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>
<div class="container">

<button class="back-btn" onclick="goBack()">← Geri</button>

<h2 id="title">Karaoke Kategorileri</h2>

<div id="list" class="list"></div>

</div>

<script>
// ================== KATEGORİLER ==================
const categories = [
  {name:"Pop Müzik", url:"karaoke-pop.html"},
  {name:"THM/Özgün", url:"karaoke-thm.html"},
  {name:"TSM", url:"karaoke-tsm.html"},
  {name:"Arabesk", url:"karaoke-arabesk.html"},
  {name:"Türkçe Rock", url:"karaoke-rock.html"},
  {name:"Rap", url:"karaoke-rap.html"},
  {name:"Türk Müzik Grupları", url:"karaoke-grup.html"},
  {name:"Yabancı", url:"karaoke-foreign.html"}
];

// ================== UYGULAMA ==================
const listEl = document.getElementById("list");

function renderCategories(){
  listEl.innerHTML = "";
  categories.forEach(cat=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = cat.name;
    div.onclick = ()=>window.location.href = cat.url;
    listEl.appendChild(div);
  });
}

// Ana sayfaya yönlendiren geri butonu
function goBack(){
  window.location.href = 'index.html';
}

renderCategories();
</script>

</body>
</html>
