// Diğer kategoriler için boş placeholder veri
const thmData = {};
const tsmData = {};
const arabeskData = {};
const turkRockData = {};
const rapData = {};
const turkGruplariData = {};
const yabanciData = {};

// Kategoriler
const categories = [
  {name:"Pop Müzik", data:popData},
  {name:"THM / Özgün", data:thmData},
  {name:"TSM", data:tsmData},
  {name:"Arabesk", data:arabeskData},
  {name:"Türkçe Rock", data:turkRockData},
  {name:"Rap", data:rapData},
  {name:"Türk Müzik Grupları", data:turkGruplariData},
  {name:"Yabancı", data:yabanciData}
];

let view = "categories"; // başlangıçta kategori görünümü
let currentData = null;
let artists = [];

const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const searchEl = document.getElementById("search");

// Render fonksiyonları
function renderCategories(){
  listEl.innerHTML = "";
  categories.forEach(cat=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = cat.name;
    div.onclick = ()=>{
      currentData = cat.data;
      artists = Object.keys(currentData).sort((a,b)=>a.localeCompare(b,"tr"));
      view = "artists";
      titleEl.innerText = cat.name + " – Sanatçılar";
      searchEl.style.display = "block";
      searchEl.value = "";
      renderArtists(artists);
    };
    listEl.appendChild(div);
  });
}

function renderArtists(list){
  listEl.innerHTML = "";
  list.forEach(name=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = name;
    div.onclick = ()=>showSongs(name);
    listEl.appendChild(div);
  });
}

function filterArtists(val){
  val = val.toLowerCase();
  renderArtists(
    artists.filter(a=>a.toLowerCase().startsWith(val))
  );
}

function showSongs(artist){
  view = "songs";
  titleEl.innerText = artist + " – Şarkılar";
  searchEl.style.display = "none";
  listEl.innerHTML = "";

  currentData[artist].forEach(song=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = song;
    listEl.appendChild(div);
  });
}

function goBack(){
  if(view === "songs"){
    view = "artists";
    titleEl.innerText = getCategoryName() + " – Sanatçılar";
    searchEl.style.display = "block";
    searchEl.value = "";
    renderArtists(artists);
  } else if(view === "artists"){
    view = "categories";
    titleEl.innerText = "Karaoke – Kategoriler";
    searchEl.style.display = "none";
    renderCategories();
  } else {
    history.back();
  }
}

function getCategoryName(){
  for(let cat of categories){
    if(cat.data === currentData) return cat.name;
  }
  return "";
}

// Başlangıçta kategori listesi göster
renderCategories();
