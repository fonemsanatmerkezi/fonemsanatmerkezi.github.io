<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bizi Takip Edin</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Ana sayfa butonu */
.home-btn{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#1976d2;
  color:#fff;
  padding:10px 22px;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}
.home-btn:hover{
  background:#125aa1;
}

/* Orta kutu */
.box{
  background:#fff;
  color:#000;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  text-align:center;
}

.box h2{
  margin-top:0;
  margin-bottom:22px;
}

/* Ortak buton stili */
.follow-btn{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:none;
  border-radius:16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  transition:.15s;
}

.follow-btn:active{
  transform:scale(.96);
}

/* Platform renkleri */
.instagram{
  background:#E1306C;
}

.tiktok{
  background:#000;
}

.google{
  background:#4285F4;
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">🏠 Ana Sayfaya Dön</a>

<div class="box">
  <h2>Bizi Takip Edin</h2>

  <button class="follow-btn instagram"
    onclick="window.open('https://www.instagram.com/fonemsanatmerkezi/', '_blank')">
    📸 Instagram
  </button>

  <button class="follow-btn tiktok"
    onclick="window.open('https://www.tiktok.com/@fonemsanatmerkezi', '_blank')">
    🎵 TikTok
  </button>

  <button class="follow-btn google"
    onclick="window.open('https://share.google/0oSEWr7wu4Oa8pLR1', '_blank')">
    ⭐ Google’da Yorum Yap
  </button>

</div>

</body>
</html>
