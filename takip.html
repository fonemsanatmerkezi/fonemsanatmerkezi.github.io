<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilek / İstek / Öneri</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
  url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Ana sayfa butonu */
.home-btn{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#1976d2;
  color:#fff;
  padding:10px 22px;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}
.home-btn:hover{
  background:#125aa1;
}

/* Form kutusu */
.form-box{
  background:#fff;
  color:#000;
  padding:26px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.form-box h2{
  text-align:center;
  margin-top:0;
}

/* Form alanları */
label{
  display:block;
  margin-top:12px;
  font-weight:600;
  font-size:14px;
}

input, textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px 12px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
  font-family:'Montserrat', sans-serif;
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* Ortak buton stili */
.submit-btn{
  width:100%;
  box-sizing:border-box;
  margin-top:14px;
  padding:13px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  transition:.15s;
}

.submit-btn:active{
  transform:scale(.97);
}

/* WhatsApp & Email aynı stil */
.whatsapp-btn,
.email-btn{
  background:#25D366;
}

.email-btn{
  margin-top:10px;
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">🏠 Ana Sayfaya Dön</a>

<div class="form-box">
  <h2>Dilek / İstek / Öneri</h2>

  <form id="dilekForm">
    <label>Ad Soyad *</label>
    <input type="text" id="adSoyad" required>

    <label>Telefon *</label>
    <input type="tel" id="telefon" required>

    <label>Email (isteğe bağlı)</label>
    <input type="email" id="email">

    <label>Açıklama *</label>
    <textarea id="aciklama" required></textarea>

    <button type="submit" class="submit-btn whatsapp-btn">
      WhatsApp ile Gönder
    </button>

    <button type="button" id="emailBtn" class="submit-btn email-btn">
      Email ile Gönder
    </button>
  </form>
</div>

<script>
const form = document.getElementById("dilekForm");
const emailBtn = document.getElementById("emailBtn");

function formVerisiniAl(){
  const ad = document.getElementById("adSoyad").value.trim();
  const tel = document.getElementById("telefon").value.trim();
  const email = document.getElementById("email").value.trim();
  const aciklama = document.getElementById("aciklama").value.trim();

  if(!ad || !tel || !aciklama){
    alert("Lütfen zorunlu alanları doldurun.");
    return null;
  }

  return { ad, tel, email, aciklama };
}

/* WhatsApp */
form.addEventListener("submit", function(e){
  e.preventDefault();
  const data = formVerisiniAl();
  if(!data) return;

  let mesaj =
`DİLEK / İSTEK / ÖNERİ
------------------------
Ad Soyad: ${data.ad}
Telefon: ${data.tel}
${data.email ? "Email: " + data.email : ""}
Açıklama:
${data.aciklama}
------------------------`;

  window.open(
    "https://wa.me/905417195706?text=" + encodeURIComponent(mesaj),
    "_blank"
  );
});

/* Email */
emailBtn.addEventListener("click", function(){
  const data = formVerisiniAl();
  if(!data) return;

  let body =
`DİLEK / İSTEK / ÖNERİ
------------------------
Ad Soyad: ${data.ad}
Telefon: ${data.tel}
${data.email ? "Email: " + data.email : ""}
Açıklama:
${data.aciklama}
------------------------`;

  window.location.href =
    "mailto:fonemsanatmerkezi@gmail.com" +
    "?subject=" + encodeURIComponent("Dilek / İstek / Öneri") +
    "&body=" + encodeURIComponent(body);
});
</script>

</body>
</html>
