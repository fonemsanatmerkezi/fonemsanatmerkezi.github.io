<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonem Sanat Merkezi</title>

<!-- Google Font (Premium, sade) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: url("assets/arka-plan.jpg") center/cover no-repeat fixed;
  overflow: hidden;
}

/* Karartma (premium etki) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 0;
}

/* ORTA ALAN */
.center-wrapper {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SVG BOYUT */
.menu-svg {
  width: min(82vw, 420px);
  height: min(82vw, 420px);
}

/* Dilimler */
.slice {
  fill: #ffffff;
  cursor: pointer;
  transition: fill 0.25s ease;
}

.slice:hover {
  fill: #f2e9ff;
}

/* Yazılar */
.slice-text {
  fill: #5b2d91;
  font-size: 14px;
  font-weight: 500;
  pointer-events: none;
  text-anchor: middle;
}

/* Orta daire */
.center-circle {
  fill: #ffffff;
  stroke: #a45cf5;
  stroke-width: 3;
}

/* Logo */
.logo {
  pointer-events: none;
}

/* Hoşgeldiniz */
#welcome {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 28px;
  z-index: 99;
  animation: fadeOut 3s forwards;
}

@keyframes fadeOut {
  0% {opacity:1}
  70% {opacity:1}
  100% {opacity:0; visibility:hidden}
}
</style>
</head>

<body>

<div id="welcome" style="display:none;">
  Fonem Sanat Merkezi’ne Hoş Geldiniz
</div>

<div class="center-wrapper">

<svg class="menu-svg" viewBox="0 0 400 400">

  <!-- Dilimler -->
  <g onclick="go('karaoke.html')">
    <path class="slice" d="M200 200 L200 10 A190 190 0 0 1 350 80 Z"/>
    <text class="slice-text" x="260" y="90">Karaoke Şarkı<br/>Hatırlatıcı</text>
  </g>

  <g onclick="go('fiyatlar.html')">
    <path class="slice" d="M200 200 L350 80 A190 190 0 0 1 350 320 Z"/>
    <text class="slice-text" x="305" y="215">Fiyatlarımız</text>
  </g>

  <g onclick="go('fotograflar.html')">
    <path class="slice" d="M200 200 L350 320 A190 190 0 0 1 200 390 Z"/>
    <text class="slice-text" x="260" y="335">Fotoğraflarımız</text>
  </g>

  <g onclick="go('takip.html')">
    <path class="slice" d="M200 200 L200 390 A190 190 0 0 1 50 320 Z"/>
    <text class="slice-text" x="135" y="335">Bizi Takip Edin</text>
  </g>

  <g onclick="go('oneri.html')">
    <path class="slice" d="M200 200 L50 320 A190 190 0 0 1 50 80 Z"/>
    <text class="slice-text" x="95" y="215">Dilek / Öneri</text>
  </g>

  <g onclick="go('rezervasyon.html')">
    <path class="slice" d="M200 200 L50 80 A190 190 0 0 1 200 10 Z"/>
    <text class="slice-text" x="135" y="90">Rezervasyon</text>
  </g>

  <!-- Orta -->
  <circle class="center-circle" cx="200" cy="200" r="55"/>

  <image href="assets/logo.png" x="165" y="165" width="70" height="70" class="logo"/>

</svg>

</div>

<audio id="clickSound" src="assets/click.mp3"></audio>

<script>
function go(url){
  document.getElementById("clickSound").play();
  setTimeout(()=>{ window.location.href = url }, 150);
}

/* Hoşgeldiniz sadece ilk giriş */
if(!localStorage.getItem("fonem_welcome")){
  document.getElementById("welcome").style.display="flex";
  localStorage.setItem("fonem_welcome","ok");
}
</script>

</body>
</html>
