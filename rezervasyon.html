<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezervasyon - Fonem Sanat Merkezi</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)), url("github-arka-plan.jpeg") center/cover fixed;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  flex-direction:column;
  text-align:center;
}

/* Ana Sayfaya Dön Butonu */
.home-btn{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 20px;
  background:#1976d2; /* mavi renk */
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  text-decoration:none;
  transition:0.2s;
}
.home-btn:hover{
  background:#135ba1;
}

/* Kutular */
.rezervasyon-box{
  background:rgba(255,255,255,0.95);
  color:#000;
  padding:25px;
  border-radius:16px;
  box-shadow:0 6px 14px rgba(0,0,0,0.3);
  max-width:400px;
  width:90%;
  margin-top:40px; /* ana sayfa butonu üstte olduğundan */
}

/* WhatsApp Butonu */
.whatsapp-btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 20px;
  background:#25D366;
  color:#fff;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;
  text-decoration:none;
  transition:0.2s;
}
.whatsapp-btn:hover{
  background:#1ebe57;
}
</style>
</head>
<body>

<!-- Ana Sayfaya Dön Butonu -->
<a href="index.html" class="home-btn">🏠 Ana Sayfaya Dön</a>

<div class="rezervasyon-box">
  <h2>Rezervasyon</h2>
  <p>Lütfen bizimle iletişime geçiniz</p>
  <p>📞 541 719 57 06</p>
  <a href="https://wa.me/905417195706" target="_blank" class="whatsapp-btn">WhatsApp ile Yaz</a>
</div>

</body>
</html>
